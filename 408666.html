<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四年級國語生字大挑戰</title>
    <style>
        /* ================= 基礎設定 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', '微軟正黑體', 'Arial', sans-serif;
        }

        body {
            /* 國語專屬：翡翠綠/書香綠漸層背景 */
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        /* ================= 動畫效果 ================= */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-bounce { animation: bounce 2s infinite ease-in-out; }
        .animate-pulse { animation: pulse 1.5s infinite; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* ================= 畫面容器 ================= */
        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }
        .screen-large {
            max-width: 800px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            border: 6px solid #ffffff;
            position: relative;
            text-align: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background-color: #a7f3d0;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.6;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -20px;
            width: 80px;
            height: 80px;
            background-color: #6ee7b7;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.5;
        }
        .card-content {
            position: relative;
            z-index: 10;
        }

        /* ================= 元件樣式 ================= */
        h1 {
            color: #059669;
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #d1fae5;
        }

        p.subtitle {
            color: #4b5563;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .input-box {
            width: 100%;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border: 4px solid #e5e7eb;
            border-radius: 20px;
            background-color: #f9fafb;
            color: #374151;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .input-box:focus {
            border-color: #10b981;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        }

        .error-msg {
            color: #ef4444;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            display: none;
        }

        /* --- 立體按鈕 --- */
        .btn-3d {
            width: 100%;
            padding: 18px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            position: relative;
            top: 0;
        }
        .btn-3d:active {
            top: 6px;
            border-bottom-width: 0 !important;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            border-bottom: 8px solid #047857;
            box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.4);
        }
        .btn-primary:hover { background: linear-gradient(180deg, #34d399 0%, #10b981 100%); }

        .btn-secondary {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            border-bottom: 8px solid #b45309;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(217, 119, 6, 0.4);
        }
        .btn-secondary:hover { background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%); }

        .btn-ghost {
            background: #ffffff;
            border-bottom: 6px solid #d1d5db;
            color: #4b5563;
            border-top: 2px solid #e5e7eb;
            border-left: 2px solid #e5e7eb;
            border-right: 2px solid #e5e7eb;
            margin-top: 15px;
        }
        .btn-ghost:hover { background: #f9fafb; color: #374151; }

        /* ================= 遊戲區塊專屬 ================= */
        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
        }
        .badge {
            background-color: white;
            padding: 10px 20px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 3px solid;
        }
        .badge-green { border-color: #6ee7b7; color: #059669; }
        .badge-yellow { border-color: #fde68a; color: #d97706; display: flex; align-items: center; gap: 8px; }

        .question-box {
            background-color: white;
            border: 4px solid #6ee7b7;
            border-radius: 24px;
            padding: 30px;
            min-height: 220px;
            margin-bottom: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .q-category-tag {
            background-color: #059669;
            color: white;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 18px;
            margin-bottom: 15px;
            box-shadow: 2px 2px 0px #047857;
            transform: rotate(-2deg);
        }
        .question-text {
            font-size: 32px;
            font-weight: bold;
            color: #1f2937;
            line-height: 1.5;
            text-align: center;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            width: 100%;
        }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .btn-mc {
            background: white;
            border: 3px solid #e5e7eb;
            border-bottom: 8px solid #d1d5db;
            color: #374151;
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-start;
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn-mc:active {
            transform: translateY(6px);
            border-bottom-width: 2px !important;
            margin-bottom: 6px;
        }
        .btn-mc:hover { border-color: #6ee7b7; background: #ecfdf5; }
        .mc-num {
            background-color: #d1fae5;
            color: #059669;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            flex-shrink: 0;
        }

        /* 回饋遮罩 */
        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .feedback-overlay.show { opacity: 1; }
        .feedback-correct { background-color: rgba(52, 211, 153, 0.95); }
        .feedback-wrong { background-color: rgba(248, 113, 113, 0.95); }
        .feedback-icon { font-size: 100px; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
        .feedback-text { font-size: 40px; font-weight: 900; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* ================= 結算與排行榜 ================= */
        .score-box {
            background: #f0fdf4;
            border: 4px solid #a7f3d0;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 20px;
            transform: rotate(1deg);
        }
        .score-box h3 { color: #4b5563; font-size: 24px; margin-bottom: 10px; }
        .score-num { color: #10b981; font-size: 80px; font-weight: 900; line-height: 1; text-shadow: 3px 3px 0 #a7f3d0; }
        
        .time-box {
            background: #fffbeb;
            border: 4px solid #fde68a;
            border-radius: 16px;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #d97706;
            margin-bottom: 30px;
            transform: rotate(-1deg);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #6ee7b7;
        }
        .leaderboard-table th {
            background-color: #d1fae5;
            color: #047857;
            padding: 15px;
            font-size: 20px;
        }
        .leaderboard-table td {
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #374151;
            border-bottom: 1px solid #f3f4f6;
        }
        .leaderboard-table tr:nth-child(even) { background-color: #f9fafb; }
        .leaderboard-table tr:nth-child(odd) { background-color: #ffffff; }
    </style>
</head>
<body>

    <!-- ================= 登入畫面 ================= -->
    <div id="screen-login" class="screen active fade-in">
        <div class="card">
            <div class="card-content">
                <div class="animate-bounce" style="font-size: 90px; margin-bottom: -10px; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.15));">📖</div>
                <h1>國語生字大挑戰</h1>
                <p class="subtitle">注音 30 題、部首 70 題，準備拿滿分了嗎？</p>
                
                <input type="text" id="seat-input" class="input-box" placeholder="👉 請輸入你的座號">
                <div id="login-error" class="error-msg">哎呀！請先輸入座號才能開始喔！</div>
                
                <button class="btn-3d btn-primary" onclick="startGame()">
                    <span style="font-size: 28px;">✍️</span> 開始挑戰！
                </button>
            </div>
        </div>
        
        <button id="btn-show-leaderboard" class="btn-3d btn-ghost" style="max-width: 300px; margin-top: 20px;" onclick="showScreen('screen-leaderboard')">
            <span>🏆</span> <span id="btn-lb-text">查看全班連線榜</span>
        </button>
    </div>

    <!-- ================= 遊戲畫面 ================= -->
    <div id="screen-playing" class="screen screen-large fade-in">
        <div class="top-bar">
            <div class="badge badge-green" id="question-counter">第 1 / 100 題</div>
            <div class="badge badge-yellow">
                <span class="animate-pulse">⏱️</span> 
                <span id="timer-display">0分 0秒</span>
            </div>
        </div>

        <div class="question-box" id="question-box">
            <div id="feedback-overlay" class="feedback-overlay">
                <div class="feedback-icon" id="feedback-icon"></div>
                <div class="feedback-text" id="feedback-text"></div>
            </div>

            <div class="q-category-tag" id="question-category-tag">題型</div>
            <div class="question-text" id="question-text">題目載入中...</div>
        </div>

        <div id="options-container" class="options-grid"></div>
    </div>

    <!-- ================= 結果畫面 ================= -->
    <div id="screen-result" class="screen fade-in">
        <div class="card" style="border-color: #6ee7b7;">
            <div class="card-content">
                <h2 style="color: #059669; font-size: 40px; font-weight: 900; margin-bottom: 20px;">挑戰完成！</h2>
                
                <div class="score-box">
                    <h3>你的總分</h3>
                    <div class="score-num"><span id="final-score">100</span><span style="font-size: 30px;">分</span></div>
                </div>

                <div class="time-box">
                    ⏱️ 花費時間：<span id="final-time"></span>
                </div>

                <button class="btn-3d btn-secondary" style="margin-bottom: 15px;" onclick="showScreen('screen-leaderboard')">
                    <span style="font-size: 28px;">🏆</span> 全班連線榜
                </button>
                <button class="btn-3d btn-ghost" onclick="showScreen('screen-login')">
                    <span style="font-size: 28px;">🔄</span> 再挑戰一次 (刷最高分)
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 排行榜畫面 ================= -->
    <div id="screen-leaderboard" class="screen screen-large fade-in">
        <div class="card" style="border-color: #6ee7b7;">
            <div class="card-content">
                <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 25px;">
                    <span style="font-size: 40px;">🌟</span>
                    <h2 style="color: #047857; font-size: 36px; font-weight: 900;">全班連線排行榜</h2>
                    <span style="font-size: 40px;">🌟</span>
                </div>

                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>名次</th>
                            <th>座號</th>
                            <th>最高分</th>
                            <th>花費時間</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="4" style="text-align: center; padding: 30px; color: #9ca3af;">資料連線中...</td></tr>
                    </tbody>
                </table>

                <button class="btn-3d btn-primary" onclick="showScreen('screen-login')">
                    <span style="font-size: 28px;">🔄</span> 回首頁挑戰
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 遊戲核心邏輯與雲端連線 ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 💯 100題 終極生字題庫 (注音30題、部首70題)
        const quizDataDB = [
            // ================== 注音大考驗 (30題) ==================
            { q: "「曉」的注音是？", type: "mc", opts: ["ㄒㄧㄠˇ", "ㄖㄠˇ", "ㄧㄠˇ", "ㄒㄧㄠˋ"], a: 0, category: "注音大考驗" },
            { q: "「賽」的注音是？", type: "mc", opts: ["ㄙㄞˋ", "ㄕㄞˋ", "ㄙㄞˇ", "ㄓㄞˋ"], a: 0, category: "注音大考驗" },
            { q: "「弱」的注音是？", type: "mc", opts: ["ㄖㄨㄛˋ", "ㄌㄨㄛˋ", "ㄖㄨㄛˇ", "ㄋㄨㄛˋ"], a: 0, category: "注音大考驗" },
            { q: "「哀」的注音是？", type: "mc", opts: ["ㄞ", "ㄞˇ", "ㄏㄞ", "ㄕㄨㄞ"], a: 0, category: "注音大考驗" },
            { q: "「准」的注音是？", type: "mc", opts: ["ㄓㄨㄣˇ", "ㄓㄨㄣˋ", "ㄘㄨㄣˇ", "ㄗㄨㄣˇ"], a: 0, category: "注音大考驗" },
            { q: "「觸」的注音是？", type: "mc", opts: ["ㄔㄨˋ", "ㄔㄨˇ", "ㄓㄨˋ", "ㄓㄨˇ"], a: 0, category: "注音大考驗" },
            { q: "「振」的注音是？", type: "mc", opts: ["ㄓㄣˋ", "ㄓㄥˋ", "ㄔㄣˋ", "ㄔㄥˋ"], a: 0, category: "注音大考驗" },
            { q: "「局」的注音是？", type: "mc", opts: ["ㄐㄩˊ", "ㄐㄩˋ", "ㄑㄩˊ", "ㄑㄩˋ"], a: 0, category: "注音大考驗" },
            { q: "「輸」的注音是？", type: "mc", opts: ["ㄕㄨ", "ㄙㄨ", "ㄕㄨˋ", "ㄙㄨˋ"], a: 0, category: "注音大考驗" },
            { q: "「壘」的注音是？", type: "mc", opts: ["ㄌㄟˇ", "ㄌㄟˋ", "ㄋㄟˇ", "ㄖㄨㄟˇ"], a: 0, category: "注音大考驗" },
            { q: "「菠」的注音是？", type: "mc", opts: ["ㄅㄛ", "ㄆㄛ", "ㄅㄛˊ", "ㄆㄛˊ"], a: 0, category: "注音大考驗" },
            { q: "「領」的注音是？", type: "mc", opts: ["ㄌㄧㄥˇ", "ㄌㄧㄥˋ", "ㄋㄧㄥˇ", "ㄋㄧㄥˋ"], a: 0, category: "注音大考驗" },
            { q: "「喘」的注音是？", type: "mc", opts: ["ㄔㄨㄢˇ", "ㄔㄨㄢˋ", "ㄘㄨㄢˇ", "ㄉㄨㄢˇ"], a: 0, category: "注音大考驗" },
            { q: "「愈」的注音是？", type: "mc", opts: ["ㄩˋ", "ㄩˇ", "ㄖㄨˋ", "ㄧㄡˋ"], a: 0, category: "注音大考驗" },
            { q: "「噪」的注音是？", type: "mc", opts: ["ㄗㄠˋ", "ㄘㄠˋ", "ㄓㄠˋ", "ㄙㄠˋ"], a: 0, category: "注音大考驗" },
            { q: "「拚」的注音是？", type: "mc", opts: ["ㄆㄧㄣ", "ㄆㄢˋ", "ㄅㄢˋ", "ㄈㄣˋ"], a: 0, category: "注音大考驗" },
            { q: "「衝」的注音是？", type: "mc", opts: ["ㄔㄨㄥ", "ㄘㄨㄥ", "ㄔㄨㄥˋ", "ㄘㄨㄥˋ"], a: 0, category: "注音大考驗" },
            { q: "「猶」的注音是？", type: "mc", opts: ["ㄧㄡˊ", "ㄧㄡˋ", "ㄖㄡˊ", "ㄖㄡˋ"], a: 0, category: "注音大考驗" },
            { q: "「豫」的注音是？", type: "mc", opts: ["ㄩˋ", "ㄩˇ", "ㄖㄨˋ", "ㄧㄡˋ"], a: 0, category: "注音大考驗" },
            { q: "「膽」的注音是？", type: "mc", opts: ["ㄉㄢˇ", "ㄉㄢˋ", "ㄉㄢ", "ㄉㄤˇ"], a: 0, category: "注音大考驗" },
            { q: "「贏」的注音是？", type: "mc", opts: ["ㄧㄥˊ", "ㄧㄥˇ", "ㄧㄥˋ", "ㄧㄣˊ"], a: 0, category: "注音大考驗" },
            { q: "「挨」的注音是？", type: "mc", opts: ["ㄞˊ", "ㄞ", "ㄞˋ", "ㄏㄞ"], a: 0, category: "注音大考驗" },

            { q: "「劃」的注音是？", type: "mc", opts: ["ㄏㄨㄚˋ", "ㄏㄨㄚˊ", "ㄏㄨㄚ", "ㄈㄚˋ"], a: 0, category: "注音大考驗" },
            { q: "「途」的注音是？", type: "mc", opts: ["ㄊㄨˊ", "ㄊㄨˇ", "ㄊㄨˋ", "ㄉㄨˊ"], a: 0, category: "注音大考驗" },
            { q: "「霧」的注音是？", type: "mc", opts: ["ㄨˋ", "ㄨˊ", "ㄨˇ", "ㄇㄨˋ"], a: 0, category: "注音大考驗" },
            { q: "「舒」的注音是？", type: "mc", opts: ["ㄕㄨ", "ㄙㄨ", "ㄕㄨˋ", "ㄙㄨˋ"], a: 0, category: "注音大考驗" },
            { q: "「緩」的注音是？", type: "mc", opts: ["ㄏㄨㄢˇ", "ㄏㄨㄢˋ", "ㄏㄨㄢ", "ㄈㄢˇ"], a: 0, category: "注音大考驗" },
            { q: "「棧」的注音是？", type: "mc", opts: ["ㄓㄢˋ", "ㄓㄢˇ", "ㄔㄢˋ", "ㄑㄧㄢˇ"], a: 0, category: "注音大考驗" },
            
            // ================== 部首大考驗 (70題) ==================

        // 設置即時監聽雲端資料庫
        function setupCloudListener() {
            if (!currentUser) return;
            
            // ⚠️ 專屬雲端黑板名稱，確保跟健體、綜合活動分開
            const lbCollection = collection(db, 'leaderboard_chinese_100');
            
            onSnapshot(lbCollection, (snapshot) => {
                cloudLeaderboard = [];
                snapshot.forEach(doc => {
                    cloudLeaderboard.push(doc.data());
                });
                
                cloudLeaderboard.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.time - b.time;
                });
                
                renderLeaderboard();
            }, (error) => {
                console.error("讀取雲端排行榜發生錯誤! 請問 Rules 有設為 allow read, write: if true 嗎？", error);
                document.getElementById('btn-lb-text').innerText = "讀取權限錯誤";
            });
        }

        // 上傳成績到雲端
        async function saveScoreToCloud(seat, score, time) {
            if (!currentUser) {
                // 單機模式備用邏輯
                const existing = cloudLeaderboard.find(e => e.seat === seat);
                if (existing) {
                    if (score > existing.score || (score === existing.score && time < existing.time)) {
                        existing.score = score;
                        existing.time = time;
                    }
                } else {
                    cloudLeaderboard.push({ seat, score, time });
                }
                cloudLeaderboard.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.time - b.time;
                });
                return;
            }

            try {
                const existing = cloudLeaderboard.find(e => e.seat === seat);
                if (existing) {
                    if (score < existing.score || (score === existing.score && time >= existing.time)) {
                        return; // 成績沒有進步，不更新雲端
                    }
                }
                
                // ⚠️ 寫入成績
                const docRef = doc(db, 'leaderboard_chinese_100', seat);
                await setDoc(docRef, { seat, score, time });
                console.log(`✅ 座號 ${seat} 的成績上傳成功！`);
            } catch (error) {
                console.error("❌ 上傳成績到雲端失敗:", error);
                alert("成績上傳失敗！請老師檢查 Firebase 權限設定。");
            }
        }

        // --- 以下為遊戲邏輯 ---
        function shuffleArray(array) {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}分 ${s}秒`;
        }

        window.showScreen = function(screenId) {
            const screens = ['screen-login', 'screen-playing', 'screen-result', 'screen-leaderboard'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (id === screenId) {
                    el.classList.add('active');
                    el.classList.remove('fade-in');
                    void el.offsetWidth; 
                    el.classList.add('fade-in');
                } else {
                    el.classList.remove('active');
                }
            });

            if (screenId === 'screen-login') {
                document.getElementById('seat-input').value = '';
                document.getElementById('login-error').style.display = 'none';
            } else if (screenId === 'screen-leaderboard') {
                renderLeaderboard();
            }
        }

        window.startGame = function() {
            const seatInput = document.getElementById('seat-input').value.trim();
            const errorMsg = document.getElementById('login-error');
            
            if (!seatInput) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';
            currentSeat = seatInput;

            // 100 題完全打亂出題
            currentQuestions = shuffleArray(quizDataDB);
            
            currentIndex = 0;
            currentScore = 0;
            isAnswering = false;
            
            window.showScreen('screen-playing');
            
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timer-display').innerText = formatTime(elapsed);
            }, 1000);

            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            // 顯示 100 題的進度
            document.getElementById('question-counter').innerText = `第 ${currentIndex + 1} / 100 題`;
            document.getElementById('question-category-tag').innerText = q.category;
            document.getElementById('question-text').innerText = q.q;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            document.getElementById('question-box').style.borderColor = '#6ee7b7';
            document.getElementById('feedback-overlay').classList.remove('show');

            optsContainer.className = 'options-grid grid-2';
            
            // 將選項隨機打亂，以防背答案順序
            let optsWithIndex = q.opts.map((opt, originalIndex) => ({ opt, originalIndex }));
            optsWithIndex = shuffleArray(optsWithIndex);

            optsWithIndex.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = "btn-mc";
                // 檢查打亂後的原 index 是否等於正確答案 index
                const isCorrectOption = (item.originalIndex === q.a);
                btn.onclick = () => window.handleAnswer(isCorrectOption);
                
                const numSpan = document.createElement('span');
                numSpan.className = "mc-num";
                numSpan.innerText = String.fromCharCode(65 + idx); // 顯示 A, B, C, D
                
                const textSpan = document.createElement('span');
                textSpan.innerText = item.opt;
                
                btn.appendChild(numSpan);
                btn.appendChild(textSpan);
                optsContainer.appendChild(btn);
            });
            isAnswering = false;
        }

        window.handleAnswer = function(isCorrect) {
            if (isAnswering) return;
            isAnswering = true;
            
            if (isCorrect) currentScore += 1; // 1題1分，共100分

            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');
            const qBox = document.getElementById('question-box');

            if (isCorrect) {
                overlay.className = "feedback-overlay show feedback-correct";
                icon.innerText = '✅';
                text.innerText = '答對了！';
                qBox.style.borderColor = '#34d399';
            } else {
                overlay.className = "feedback-overlay show feedback-wrong";
                icon.innerText = '❌';
                text.innerText = '答錯了！';
                qBox.style.borderColor = '#f87171';
            }

            // 稍微縮短等待時間(600毫秒)，讓 100 題的闖關更流暢
            setTimeout(() => {
                if (currentIndex + 1 < currentQuestions.length) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    finishGame();
                }
            }, 600);
        }

        async function finishGame() {
            clearInterval(timerInterval);
            const finalTime = Math.floor((Date.now() - startTime) / 1000);
            
            await saveScoreToCloud(currentSeat, currentScore, finalTime);

            document.getElementById('final-score').innerText = currentScore;
            document.getElementById('final-time').innerText = formatTime(finalTime);
            window.showScreen('screen-result');
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            
            if (cloudLeaderboard.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 30px; color: #9ca3af; font-weight:bold;">目前榜單空空如也，趕快搶下全班第一！</td></tr>`;
                return;
            }

            cloudLeaderboard.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                let rankHtml = `<span style="color:#9ca3af">${idx + 1}</span>`;
                if (idx === 0) rankHtml = '🥇';
                if (idx === 1) rankHtml = '🥈';
                if (idx === 2) rankHtml = '🥉';

                tr.innerHTML = `
                    <td style="text-align:center;">${rankHtml}</td>
                    <td style="text-align:center;">${entry.seat}</td>
                    <td style="text-align:center; color:#059669;">${entry.score}</td>
                    <td style="text-align:center; color:#4b5563; font-size:18px;">${formatTime(entry.time)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('seat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                window.startGame();
            }
        });
