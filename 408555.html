<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四年級國語成語大挑戰</title>
    <style>
        /* ================= 基礎設定 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', '微軟正黑體', 'Arial', sans-serif;
        }

        body {
            /* 國語文專屬：溫暖的橘紅漸層背景 */
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        /* ================= 動畫效果 ================= */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-bounce { animation: bounce 2s infinite ease-in-out; }
        .animate-pulse { animation: pulse 1.5s infinite; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* ================= 畫面容器 ================= */
        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }
        .screen-large {
            max-width: 800px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            border: 6px solid #ffffff;
            position: relative;
            text-align: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background-color: #fca5a5;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.6;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -20px;
            width: 80px;
            height: 80px;
            background-color: #fdba74;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.5;
        }
        .card-content {
            position: relative;
            z-index: 10;
        }

        /* ================= 元件樣式 ================= */
        h1 {
            color: #ea580c;
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #ffedd5;
        }

        p.subtitle {
            color: #78716c;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .input-box {
            width: 100%;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border: 4px solid #e7e5e4;
            border-radius: 20px;
            background-color: #fafaf9;
            color: #44403c;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .input-box:focus {
            border-color: #f97316;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.2);
        }

        .error-msg {
            color: #ef4444;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            display: none;
        }

        /* --- 立體按鈕 --- */
        .btn-3d {
            width: 100%;
            padding: 18px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            position: relative;
            top: 0;
        }
        .btn-3d:active {
            top: 6px;
            border-bottom-width: 0 !important;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
            border-bottom: 8px solid #c2410c;
            box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.4);
        }
        .btn-primary:hover { background: linear-gradient(180deg, #fb923c 0%, #f97316 100%); }

        .btn-secondary {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
            border-bottom: 8px solid #b91c1c;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(220, 38, 38, 0.4);
        }
        .btn-secondary:hover { background: linear-gradient(180deg, #f87171 0%, #ef4444 100%); }

        .btn-ghost {
            background: #ffffff;
            border-bottom: 6px solid #d6d3d1;
            color: #57534e;
            border-top: 2px solid #e7e5e4;
            border-left: 2px solid #e7e5e4;
            border-right: 2px solid #e7e5e4;
            margin-top: 15px;
        }
        .btn-ghost:hover { background: #fafaf9; color: #44403c; }

        /* ================= 遊戲區塊專屬 ================= */
        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
        }
        .badge {
            background-color: white;
            padding: 10px 20px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 3px solid;
        }
        .badge-orange { border-color: #fdba74; color: #ea580c; }
        .badge-red { border-color: #fca5a5; color: #dc2626; display: flex; align-items: center; gap: 8px; }

        .question-box {
            background-color: white;
            border: 4px solid #fdba74;
            border-radius: 24px;
            padding: 30px;
            min-height: 220px;
            margin-bottom: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .q-category-tag {
            background-color: #ea580c;
            color: white;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 18px;
            margin-bottom: 5px;
            box-shadow: 2px 2px 0px #c2410c;
        }
        .q-type-tag {
            background-color: #ef4444;
            color: white;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            transform: rotate(-2deg);
        }
        .question-text {
            font-size: 26px;
            font-weight: bold;
            color: #292524;
            line-height: 1.5;
            text-align: center;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            width: 100%;
        }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .btn-tf-o {
            background: #4ade80;
            border-bottom: 12px solid #16a34a;
            color: white;
            font-size: 80px;
            border-radius: 30px;
            padding: 20px 0;
            text-shadow: 0 4px 0 #16a34a;
        }
        .btn-tf-o:active { border-bottom-width: 0 !important; top: 12px; margin-bottom: 12px; }
        
        .btn-tf-x {
            background: #f87171;
            border-bottom: 12px solid #dc2626;
            color: white;
            font-size: 80px;
            border-radius: 30px;
            padding: 20px 0;
            text-shadow: 0 4px 0 #dc2626;
        }
        .btn-tf-x:active { border-bottom-width: 0 !important; top: 12px; margin-bottom: 12px; }

        .btn-mc {
            background: white;
            border: 3px solid #e7e5e4;
            border-bottom: 8px solid #d6d3d1;
            color: #44403c;
            font-size: 22px;
            font-weight: bold;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-start;
        }
        .btn-mc:hover { border-color: #fdba74; background: #fff7ed; }
        .mc-num {
            background-color: #ffedd5;
            color: #ea580c;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            flex-shrink: 0;
        }

        /* 回饋遮罩 */
        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .feedback-overlay.show { opacity: 1; }
        .feedback-correct { background-color: rgba(74, 222, 128, 0.95); }
        .feedback-wrong { background-color: rgba(248, 113, 113, 0.95); }
        .feedback-icon { font-size: 100px; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
        .feedback-text { font-size: 40px; font-weight: 900; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* ================= 結算與排行榜 ================= */
        .score-box {
            background: #f0fdf4;
            border: 4px solid #bbf7d0;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 20px;
            transform: rotate(1deg);
        }
        .score-box h3 { color: #64748b; font-size: 24px; margin-bottom: 10px; }
        .score-num { color: #22c55e; font-size: 80px; font-weight: 900; line-height: 1; text-shadow: 3px 3px 0 #bbf7d0; }
        
        .time-box {
            background: #fef2f2;
            border: 4px solid #fca5a5;
            border-radius: 16px;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 30px;
            transform: rotate(-1deg);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #fdba74;
        }
        .leaderboard-table th {
            background-color: #ffedd5;
            color: #c2410c;
            padding: 15px;
            font-size: 20px;
        }
        .leaderboard-table td {
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #57534e;
            border-bottom: 1px solid #f5f5f4;
        }
        .leaderboard-table tr:nth-child(even) { background-color: #fafaf9; }
        .leaderboard-table tr:nth-child(odd) { background-color: #ffffff; }
    </style>
</head>
<body>

    <div id="screen-login" class="screen active fade-in">
        <div class="card">
            <div class="card-content">
                <div class="animate-bounce" style="font-size: 90px; margin-bottom: -10px; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.15));">🎓</div>
                <h1>成語小達人</h1>
                <p class="subtitle">總共 8 個大題，挑戰 100 分！</p>
                
                <input type="text" id="seat-input" class="input-box" placeholder="👉 請輸入你的座號">
                <div id="login-error" class="error-msg">哎呀！請先輸入座號才能開始喔！</div>
                
                <button class="btn-3d btn-primary" onclick="startGame()">
                    <span style="font-size: 28px;">✍️</span> 開始挑戰！
                </button>
            </div>
        </div>
        
        <button id="btn-show-leaderboard" class="btn-3d btn-ghost" style="max-width: 300px; margin-top: 20px;" onclick="showScreen('screen-leaderboard')">
            <span>🏆</span> <span id="btn-lb-text">查看全班連線榜</span>
        </button>
    </div>

    <div id="screen-playing" class="screen screen-large fade-in">
        <div class="top-bar">
            <div class="badge badge-orange" id="question-counter">第 1 / 50 題</div>
            <div class="badge badge-red">
                <span class="animate-pulse">⏱️</span> 
                <span id="timer-display">0分 0秒</span>
            </div>
        </div>

        <div class="question-box" id="question-box">
            <div id="feedback-overlay" class="feedback-overlay">
                <div class="feedback-icon" id="feedback-icon"></div>
                <div class="feedback-text" id="feedback-text"></div>
            </div>

            <div class="q-category-tag" id="question-category-tag">大題類別</div>
            <div class="q-type-tag" id="question-type-tag">題型</div>
            <div class="question-text" id="question-text">題目載入中...</div>
        </div>

        <div id="options-container" class="options-grid"></div>
    </div>

    <div id="screen-result" class="screen fade-in">
        <div class="card" style="border-color: #86efac;">
            <div class="card-content">
                <h2 style="color: #16a34a; font-size: 40px; font-weight: 900; margin-bottom: 20px;">挑戰完成！</h2>
                
                <div class="score-box">
                    <h3>你的總分</h3>
                    <div class="score-num"><span id="final-score">100</span><span style="font-size: 30px;">分</span></div>
                </div>

                <div class="time-box">
                    ⏱️ 花費時間：<span id="final-time"></span>
                </div>

                <button class="btn-3d btn-secondary" style="margin-bottom: 15px;" onclick="showScreen('screen-leaderboard')">
                    <span style="font-size: 28px;">🏆</span> 全班連線榜
                </button>
                <button class="btn-3d btn-ghost" onclick="showScreen('screen-login')">
                    <span style="font-size: 28px;">🔄</span> 再挑戰一次 (刷最高分)
                </button>
            </div>
        </div>
    </div>

    <div id="screen-leaderboard" class="screen screen-large fade-in">
        <div class="card" style="border-color: #fdba74;">
            <div class="card-content">
                <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 25px;">
                    <span style="font-size: 40px;">🌟</span>
                    <h2 style="color: #c2410c; font-size: 36px; font-weight: 900;">全班連線排行榜</h2>
                    <span style="font-size: 40px;">🌟</span>
                </div>

                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>名次</th>
                            <th>座號</th>
                            <th>最高分</th>
                            <th>花費時間</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="4" style="text-align: center; padding: 30px; color: #a8a29e;">資料連線中...</td></tr>
                    </tbody>
                </table>

                <button class="btn-3d btn-primary" onclick="showScreen('screen-login')">
                    <span style="font-size: 28px;">🔄</span> 回首頁挑戰
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 題庫資料 (國語 L07~L12 成語，總計 8 個大題，共 50 題)
        const quizDataDB = [
            { q: "【錯別字】樂不可「知」應改為什麼字？", type: "mc", opts: ["支", "汁"], a: 0, category: "大題一、棒球英雄夢 (L07)" },
            { q: "【錯別字】家喻戶「小」應改為什麼字？", type: "mc", opts: ["曉", "肖"], a: 0, category: "大題一、棒球英雄夢 (L07)" },
            { q: "【錯別字】旗開得「聖」應改為什麼字？", type: "mc", opts: ["剩", "勝"], a: 1, category: "大題一、棒球英雄夢 (L07)" },
            { q: "【成語重組】「不、蹶、振、一」正確順序是？", type: "mc", opts: ["一蹶不振", "振一不蹶"], a: 0, category: "大題一、棒球英雄夢 (L07)" },
            { q: "【成語重組】「掌、如、易、反」正確順序是？", type: "mc", opts: ["反易如掌", "易如反掌"], a: 1, category: "大題一、棒球英雄夢 (L07)" },
            { q: "【情境是非】這道高中數學題目對小學生來說，簡直是「易如反掌」。", type: "tf", a: 1, category: "大題一、棒球英雄夢 (L07)" },
            { q: "【情境是非】你如果弄懂這些例題，就可以「觸類旁通」，計算後面的習題了。", type: "tf", a: 0, category: "大題一、棒球英雄夢 (L07)" },
            { q: "【成語填空】怒髮(  )冠？", type: "mc", opts: ["衝", "充"], a: 0, category: "大題二、夢幻全壘打 (L08)" },
            { q: "【成語填空】每下(  )況？", type: "mc", opts: ["遇", "愈"], a: 1, category: "大題二、夢幻全壘打 (L08)" },
            { q: "【成語填空】軟(  )兼施？", type: "mc", opts: ["硬", "弱"], a: 0, category: "大題二、夢幻全壘打 (L08)" },
            { q: "【成語意思】指無法掌握要點或主旨是哪句成語？", type: "mc", opts: ["不得要領", "肝膽相照"], a: 0, category: "大題二、夢幻全壘打 (L08)" },
            { q: "【成語故事】「過猶不及」的意思是？", type: "mc", opts: ["做事恰到好處就停止", "指事情要做得恰到好處，過分和不及都不好"], a: 1, category: "大題二、夢幻全壘打 (L08)" },
            { q: "【成語意思】委婉和強硬的手段一齊用上？", type: "mc", opts: ["軟硬兼施", "肝膽相照"], a: 0, category: "大題二、夢幻全壘打 (L08)" },
            { q: "【成語填空】雀屏中(  )？", type: "mc", opts: ["選", "規"], a: 0, category: "大題三、單車遊日月潭 (L09)" },
            { q: "【成語填空】力透紙(  )？", type: "mc", opts: ["背", "途"], a: 0, category: "大題三、單車遊日月潭 (L09)" },
            { q: "【成語重組】「巧、能、生、熟」正確順序是？", type: "mc", opts: ["熟能生巧", "生巧熟能"], a: 0, category: "大題三、單車遊日月潭 (L09)" },
            { q: "【成語重組】「捕、影、風、捉」正確順序是？", type: "mc", opts: ["捕風捉影", "捉風捕影"], a: 0, category: "大題三、單車遊日月潭 (L09)" },
            { q: "【情境選擇】她仗著自己的才貌，總是擺出一副(  )的架勢，讓人敬而遠之。", type: "mc", opts: ["盛氣凌人", "雀屏中選"], a: 0, category: "大題三、單車遊日月潭 (L09)" },
            { q: "【情境選擇】這個提案如果能(  )，脫穎而出，我一定會大大地獎賞你。", type: "mc", opts: ["老馬識途", "雀屏中選"], a: 1, category: "大題三、單車遊日月潭 (L09)" },
            { q: "【成語意思】獨力擔當某一方面的重任？", type: "mc", opts: ["獨當一面", "漠不關心"], a: 0, category: "大題四、孫悟空三借芭蕉扇 (L10)" },
            { q: "【成語意思】比喻人的氣勢如火焰般逼人？", type: "mc", opts: ["氣焰熏天", "菩薩心腸"], a: 0, category: "大題四、孫悟空三借芭蕉扇 (L10)" },
            { q: "【成語意思】指有度量，能寬容，才能夠成就大業？", type: "mc", opts: ["有容乃大", "漠不關心"], a: 0, category: "大題四、孫悟空三借芭蕉扇 (L10)" },
            { q: "【成語填空】(  )薩心腸？", type: "mc", opts: ["菩", "蒲"], a: 0, category: "大題四、孫悟空三借芭蕉扇 (L10)" },
            { q: "【情境選擇】小明是自私的人，凡事只想著自己，對旁人都(  )。", type: "mc", opts: ["漠不關心", "菩薩心腸"], a: 0, category: "大題四、孫悟空三借芭蕉扇 (L10)" },
            { q: "【情境選擇】這老太太真是(  )，總是原諒他人，給予對方改過自新的機會。", type: "mc", opts: ["菩薩心腸", "氣焰熏天"], a: 0, category: "大題四、孫悟空三借芭蕉扇 (L10)" },
            { q: "【情境選擇】他初出茅廬，哪有(  )的能力？", type: "mc", opts: ["有容乃大", "獨當一面"], a: 1, category: "大題四、孫悟空三借芭蕉扇 (L10)" },
            { q: "【成語意思】用來比喻學識淺陋的人？", type: "mc", opts: ["吳下阿蒙", "趨炎附勢"], a: 0, category: "大題五、最後一片葉子 (L11)" },

            { q: "【同反義判斷】「吳下阿蒙」和「刮目相看」意思相同嗎？", type: "tf", a: 1, category: "大題七、成語綜合除錯與判斷" },
            { q: "【情境選擇】老先生這幾個字寫得(  )，造詣相當高深。", type: "mc", opts: ["力透紙背", "熟能生巧"], a: 0, category: "大題八、成語綜合應用與情境" },
            { q: "【情境選擇】有些記者專門(  )，報導一些未經查證的消息。", type: "mc", opts: ["捕風捉影", "雀屏中選"], a: 0, category: "大題八、成語綜合應用與情境" },
            { q: "【成語填空】漠不(  )心？", type: "mc", opts: ["關", "觀"], a: 0, category: "大題八、成語綜合應用與情境" },
            { q: "【情境選擇】面對這些不實的謊言，我們應該(  )的加以反駁。", type: "mc", opts: ["義正辭嚴", "骨瘦如柴"], a: 0, category: "大題八、成語綜合應用與情境" },
            { q: "【同反義判斷】「妄自菲薄」和「自慚形穢」意思相同嗎？", type: "tf", a: 0, category: "大題八、成語綜合應用與情境" },
            { q: "【同義詞配對】「當務之急」的相近成語是？", type: "mc", opts: ["燃眉之急", "負重致遠"], a: 0, category: "大題八、成語綜合應用與情境" }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let currentScore = 0;
        let currentSeat = '';
        let startTime = 0;
        let timerInterval = null;
        let isAnswering = false;
        
        let firebaseApp, auth, db, currentUser;
        let cloudLeaderboard = [];

        // 🌟 老師請將您的專屬金鑰貼在這裡：
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD8jjaj6if9PwJ3ULZUBRZNUVxMJICQXro",
            authDomain: "classtest-game.firebaseapp.com",
            projectId: "classtest-game",
            storageBucket: "classtest-game.firebasestorage.app",
            messagingSenderId: "830390536169",
            appId: "1:830390536169:web:50f735890acfccf61f2d78"
        };
        // =========================================================================

        try {
            if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("您的")) {
                firebaseApp = initializeApp(firebaseConfig);
                auth = getAuth(firebaseApp);
                db = getFirestore(firebaseApp);

                // 匿名登入
                signInAnonymously(auth).catch((error) => {
                    console.error("匿名登入失敗!", error);
                    document.getElementById('btn-lb-text').innerText = "連線失敗(請檢查權限)";
                });

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) {
                        setupCloudListener();
                        document.getElementById('btn-lb-text').innerText = "查看全班連線榜";
                    } else {
                        document.getElementById('btn-lb-text').innerText = "尚未連線";
                    }
                });
            } else {
                console.warn("⚠️ 尚未填寫 Firebase 金鑰，目前為單機測試模式。");
                document.getElementById('btn-lb-text').innerText = "排行榜 (單機模式)";
            }
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
            document.getElementById('btn-lb-text').innerText = "連線發生錯誤";
        }

        // 設置即時監聽雲端資料庫 (國語成語專屬黑板)
        function setupCloudListener() {
            if (!currentUser) return;
            // 💡 國語專屬資料庫名稱：'leaderboard_chinese'
            const lbCollection = collection(db, 'leaderboard_chinese');
            
            onSnapshot(lbCollection, (snapshot) => {
                cloudLeaderboard = [];
                snapshot.forEach(doc => {
                    cloudLeaderboard.push(doc.data());
                });
                
                cloudLeaderboard.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.time - b.time;
                });
                
                renderLeaderboard();
            }, (error) => {
                console.error("讀取雲端排行榜發生錯誤!", error);
                document.getElementById('btn-lb-text').innerText = "讀取權限錯誤";
            });
        }

        // 上傳成績到雲端
        async function saveScoreToCloud(seat, score, time) {
            if (!currentUser) {
                // 單機模式備用邏輯
                const existing = cloudLeaderboard.find(e => e.seat === seat);
                if (existing) {
                    if (score > existing.score || (score === existing.score && time < existing.time)) {
                        existing.score = score;
                        existing.time = time;
                    }
                } else {
                    cloudLeaderboard.push({ seat, score, time });
                }
                cloudLeaderboard.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.time - b.time;
                });
                return;
            }

            try {
                const existing = cloudLeaderboard.find(e => e.seat === seat);
                if (existing) {
                    if (score < existing.score || (score === existing.score && time >= existing.time)) {
                        return; // 成績沒有進步，不更新
                    }
                }
                
                // 💡 國語專屬資料庫名稱：'leaderboard_chinese'
                const docRef = doc(db, 'leaderboard_chinese', seat);
                await setDoc(docRef, { seat, score, time });
                console.log(`✅ 座號 ${seat} 的成績上傳成功！`);
            } catch (error) {
                console.error("❌ 上傳成績到雲端失敗:", error);
                alert("成績上傳失敗！請老師檢查 Firebase 權限設定。");
            }
        }

        function shuffleArray(array) {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}分 ${s}秒`;
        }

        window.showScreen = function(screenId) {
            const screens = ['screen-login', 'screen-playing', 'screen-result', 'screen-leaderboard'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (id === screenId) {
                    el.classList.add('active');
                    el.classList.remove('fade-in');
                    void el.offsetWidth; 
                    el.classList.add('fade-in');
                } else {
                    el.classList.remove('active');
                }
            });

            if (screenId === 'screen-login') {
                document.getElementById('seat-input').value = '';
                document.getElementById('login-error').style.display = 'none';
            } else if (screenId === 'screen-leaderboard') {
                renderLeaderboard();
            }
        }

        window.startGame = function() {
            const seatInput = document.getElementById('seat-input').value.trim();
            const errorMsg = document.getElementById('login-error');
            
            if (!seatInput) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';
            currentSeat = seatInput;

            currentQuestions = shuffleArray(quizDataDB);
            
            currentIndex = 0;
            currentScore = 0;
            isAnswering = false;
            
            window.showScreen('screen-playing');
            
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timer-display').innerText = formatTime(elapsed);
            }, 1000);

            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('question-counter').innerText = `第 ${currentIndex + 1} / 50 題`;
            document.getElementById('question-category-tag').innerText = q.category;
            document.getElementById('question-type-tag').innerText = q.type === 'tf' ? '是非題' : '選擇題';
            document.getElementById('question-text').innerText = q.q;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            document.getElementById('question-box').style.borderColor = '#fdba74';
            document.getElementById('feedback-overlay').classList.remove('show');

            if (q.type === 'tf') {
                optsContainer.className = 'options-grid grid-2';
                
                const btnO = document.createElement('button');
                btnO.className = "btn-3d btn-tf-o";
                btnO.innerText = 'O';
                btnO.onclick = () => window.handleAnswer(0);
                
                const btnX = document.createElement('button');
                btnX.className = "btn-3d btn-tf-x";
                btnX.innerText = 'X';
                btnX.onclick = () => window.handleAnswer(1);

                optsContainer.appendChild(btnO);
                optsContainer.appendChild(btnX);
            } else {
                optsContainer.className = 'options-grid grid-2';
                
                q.opts.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "btn-3d btn-mc";
                    btn.onclick = () => window.handleAnswer(idx);
                    
                    const numSpan = document.createElement('span');
                    numSpan.className = "mc-num";
                    numSpan.innerText = String.fromCharCode(65 + idx);
                    
                    const textSpan = document.createElement('span');
                    textSpan.innerText = opt;
                    
                    btn.appendChild(numSpan);
                    btn.appendChild(textSpan);
                    optsContainer.appendChild(btn);
                });
            }
            isAnswering = false;
        }

        window.handleAnswer = function(selectedIndex) {
            if (isAnswering) return;
            isAnswering = true;

            const q = currentQuestions[currentIndex];
            const isCorrect = selectedIndex === q.a;
            
            if (isCorrect) currentScore += 2;

            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');
            const qBox = document.getElementById('question-box');

            if (isCorrect) {
                overlay.className = "feedback-overlay show feedback-correct";
                icon.innerText = '✅';
                text.innerText = '答對了！';
                qBox.style.borderColor = '#4ade80';
            } else {
                overlay.className = "feedback-overlay show feedback-wrong";
                icon.innerText = '❌';
                text.innerText = '答錯了！';
                qBox.style.borderColor = '#f87171';
            }

            setTimeout(() => {
                if (currentIndex + 1 < currentQuestions.length) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    finishGame();
                }
            }, 800);
        }

        async function finishGame() {
            clearInterval(timerInterval);
            const finalTime = Math.floor((Date.now() - startTime) / 1000);
            
            await saveScoreToCloud(currentSeat, currentScore, finalTime);

            document.getElementById('final-score').innerText = currentScore;
            document.getElementById('final-time').innerText = formatTime(finalTime);
            window.showScreen('screen-result');
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            
            if (cloudLeaderboard.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 30px; color: #a8a29e; font-weight:bold;">目前榜單空空如也，趕快搶下全班第一！</td></tr>`;
                return;
            }

            cloudLeaderboard.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                let rankHtml = `<span style="color:#a8a29e">${idx + 1}</span>`;
                if (idx === 0) rankHtml = '🥇';
                if (idx === 1) rankHtml = '🥈';
                if (idx === 2) rankHtml = '🥉';

                tr.innerHTML = `
                    <td style="text-align:center;">${rankHtml}</td>
                    <td style="text-align:center;">${entry.seat}</td>
                    <td style="text-align:center; color:#ea580c;">${entry.score}</td>
                    <td style="text-align:center; color:#78716c; font-size:18px;">${formatTime(entry.time)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('seat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                window.startGame();
            }
        });
    </script>
