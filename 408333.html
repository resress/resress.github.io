<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四年級綜合小達人闖關遊戲</title>
    <style>
        /* ================= 基礎設定 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', '微軟正黑體', 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdf4ff 0%, #fae8ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        /* ================= 動畫效果 ================= */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-bounce { animation: bounce 2s infinite ease-in-out; }
        .animate-pulse { animation: pulse 1.5s infinite; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* ================= 畫面容器 ================= */
        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }
        .screen-large {
            max-width: 800px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            border: 6px solid #ffffff;
            position: relative;
            text-align: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background-color: #fef08a;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.6;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -20px;
            width: 80px;
            height: 80px;
            background-color: #e879f9;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.3;
        }
        .card-content {
            position: relative;
            z-index: 10;
        }

        /* ================= 元件樣式 ================= */
        h1 {
            color: #c026d3;
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #fae8ff;
        }

        p.subtitle {
            color: #64748b;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .input-box {
            width: 100%;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border: 4px solid #e2e8f0;
            border-radius: 20px;
            background-color: #f8fafc;
            color: #334155;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .input-box:focus {
            border-color: #d946ef;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(217, 70, 239, 0.2);
        }

        .error-msg {
            color: #ef4444;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            display: none;
        }

        /* --- 立體按鈕 --- */
        .btn-3d {
            width: 100%;
            padding: 18px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            position: relative;
            top: 0;
        }
        .btn-3d:active {
            top: 6px;
            border-bottom-width: 0 !important;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(180deg, #d946ef 0%, #c026d3 100%);
            border-bottom: 8px solid #86198f;
            box-shadow: 0 10px 15px -3px rgba(192, 38, 211, 0.4);
        }
        .btn-primary:hover { background: linear-gradient(180deg, #e879f9 0%, #d946ef 100%); }

        .btn-secondary {
            background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
            border-bottom: 8px solid #a16207;
            color: #713f12;
            box-shadow: 0 10px 15px -3px rgba(234, 179, 8, 0.4);
        }
        .btn-secondary:hover { background: linear-gradient(180deg, #fef08a 0%, #facc15 100%); }

        .btn-ghost {
            background: #ffffff;
            border-bottom: 6px solid #cbd5e1;
            color: #475569;
            border-top: 2px solid #e2e8f0;
            border-left: 2px solid #e2e8f0;
            border-right: 2px solid #e2e8f0;
            margin-top: 15px;
        }
        .btn-ghost:hover { background: #f8fafc; color: #334155; }

        /* ================= 遊戲區塊專屬 ================= */
        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
        }
        .badge {
            background-color: white;
            padding: 10px 20px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 3px solid;
        }
        .badge-purple { border-color: #f5d0fe; color: #c026d3; }
        .badge-yellow { border-color: #fef08a; color: #ca8a04; display: flex; align-items: center; gap: 8px; }

        .question-box {
            background-color: white;
            border: 4px solid #f5d0fe;
            border-radius: 24px;
            padding: 30px;
            min-height: 220px;
            margin-bottom: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .q-category-tag {
            background-color: #eab308;
            color: white;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 18px;
            margin-bottom: 5px;
            box-shadow: 2px 2px 0px #a16207;
        }
        .q-type-tag {
            background-color: #d946ef;
            color: white;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            transform: rotate(-2deg);
        }
        .question-text {
            font-size: 26px;
            font-weight: bold;
            color: #1e293b;
            line-height: 1.5;
            text-align: center;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            width: 100%;
        }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .btn-tf-o {
            background: #4ade80;
            border-bottom: 12px solid #16a34a;
            color: white;
            font-size: 80px;
            border-radius: 30px;
            padding: 20px 0;
            text-shadow: 0 4px 0 #16a34a;
        }
        .btn-tf-o:active { border-bottom-width: 0 !important; top: 12px; margin-bottom: 12px; }
        
        .btn-tf-x {
            background: #f87171;
            border-bottom: 12px solid #dc2626;
            color: white;
            font-size: 80px;
            border-radius: 30px;
            padding: 20px 0;
            text-shadow: 0 4px 0 #dc2626;
        }
        .btn-tf-x:active { border-bottom-width: 0 !important; top: 12px; margin-bottom: 12px; }

        .btn-mc {
            background: white;
            border: 3px solid #e2e8f0;
            border-bottom: 8px solid #cbd5e1;
            color: #334155;
            font-size: 22px;
            font-weight: bold;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-start;
        }
        .btn-mc:hover { border-color: #f0abfc; background: #faf5ff; }
        .mc-num {
            background-color: #fae8ff;
            color: #c026d3;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            flex-shrink: 0;
        }

        /* 回饋遮罩 */
        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .feedback-overlay.show { opacity: 1; }
        .feedback-correct { background-color: rgba(74, 222, 128, 0.95); }
        .feedback-wrong { background-color: rgba(248, 113, 113, 0.95); }
        .feedback-icon { font-size: 100px; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
        .feedback-text { font-size: 40px; font-weight: 900; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* ================= 結算與排行榜 ================= */
        .score-box {
            background: #f0fdf4;
            border: 4px solid #bbf7d0;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 20px;
            transform: rotate(1deg);
        }
        .score-box h3 { color: #64748b; font-size: 24px; margin-bottom: 10px; }
        .score-num { color: #22c55e; font-size: 80px; font-weight: 900; line-height: 1; text-shadow: 3px 3px 0 #bbf7d0; }
        
        .time-box {
            background: #fffbeb;
            border: 4px solid #fef08a;
            border-radius: 16px;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #ca8a04;
            margin-bottom: 30px;
            transform: rotate(-1deg);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #f5d0fe;
        }
        .leaderboard-table th {
            background-color: #fae8ff;
            color: #a21caf;
            padding: 15px;
            font-size: 20px;
        }
        .leaderboard-table td {
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #475569;
            border-bottom: 1px solid #f1f5f9;
        }
        .leaderboard-table tr:nth-child(even) { background-color: #f8fafc; }
        .leaderboard-table tr:nth-child(odd) { background-color: #ffffff; }
    </style>
</head>
<body>

    <!-- ================= 登入畫面 ================= -->
    <div id="screen-login" class="screen active fade-in">
        <div class="card">
            <div class="card-content">
                <div class="animate-bounce" style="font-size: 90px; margin-bottom: -10px; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.15));">🏅</div>
                <h1>綜合活動小達人</h1>
                <p class="subtitle">總共 8 個大題，挑戰 100 分！</p>
                
                <input type="text" id="seat-input" class="input-box" placeholder="👉 請輸入你的座號">
                <div id="login-error" class="error-msg">哎呀！請先輸入座號才能開始喔！</div>
                
                <button class="btn-3d btn-primary" onclick="startGame()">
                    <span style="font-size: 28px;">🚀</span> 開始挑戰！
                </button>
            </div>
        </div>
        
        <button id="btn-show-leaderboard" class="btn-3d btn-ghost" style="max-width: 300px; margin-top: 20px;" onclick="showScreen('screen-leaderboard')">
            <span>🏆</span> <span id="btn-lb-text">查看全班連線榜</span>
        </button>
    </div>

    <!-- ================= 遊戲畫面 ================= -->
    <div id="screen-playing" class="screen screen-large fade-in">
        <div class="top-bar">
            <div class="badge badge-purple" id="question-counter">第 1 / 50 題</div>
            <div class="badge badge-yellow">
                <span class="animate-pulse">⏱️</span> 
                <span id="timer-display">0分 0秒</span>
            </div>
        </div>

        <div class="question-box" id="question-box">
            <div id="feedback-overlay" class="feedback-overlay">
                <div class="feedback-icon" id="feedback-icon"></div>
                <div class="feedback-text" id="feedback-text"></div>
            </div>

            <div class="q-category-tag" id="question-category-tag">大題類別</div>
            <div class="q-type-tag" id="question-type-tag">題型</div>
            <div class="question-text" id="question-text">題目載入中...</div>
        </div>

        <div id="options-container" class="options-grid"></div>
    </div>

    <!-- ================= 結果畫面 ================= -->
    <div id="screen-result" class="screen fade-in">
        <div class="card" style="border-color: #86efac;">
            <div class="card-content">
                <h2 style="color: #16a34a; font-size: 40px; font-weight: 900; margin-bottom: 20px;">挑戰完成！</h2>
                
                <div class="score-box">
                    <h3>你的總分</h3>
                    <div class="score-num"><span id="final-score">100</span><span style="font-size: 30px;">分</span></div>
                </div>

                <div class="time-box">
                    ⏱️ 花費時間：<span id="final-time"></span>
                </div>

                <button class="btn-3d btn-secondary" style="margin-bottom: 15px;" onclick="showScreen('screen-leaderboard')">
                    <span style="font-size: 28px;">🏆</span> 全班連線榜
                </button>
                <button class="btn-3d btn-ghost" onclick="showScreen('screen-login')">
                    <span style="font-size: 28px;">🔄</span> 再挑戰一次 (刷最高分)
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 排行榜畫面 ================= -->
    <div id="screen-leaderboard" class="screen screen-large fade-in">
        <div class="card" style="border-color: #f5d0fe;">
            <div class="card-content">
                <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 25px;">
                    <span style="font-size: 40px;">🌟</span>
                    <h2 style="color: #a21caf; font-size: 36px; font-weight: 900;">全班連線排行榜</h2>
                    <span style="font-size: 40px;">🌟</span>
                </div>

                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>名次</th>
                            <th>座號</th>
                            <th>最高分</th>
                            <th>花費時間</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="4" style="text-align: center; padding: 30px; color: #94a3b8;">資料連線中...</td></tr>
                    </tbody>
                </table>

                <button class="btn-3d btn-primary" onclick="showScreen('screen-login')">
                    <span style="font-size: 28px;">🔄</span> 回首頁挑戰
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 遊戲核心邏輯與雲端連線 ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 題庫資料
        const quizDataDB = [
            { q: "藥局和診所不但可以提供看病、領藥的服務，還可以詢問正確的用藥方式。", type: "tf", a: 0, category: "大題一、綜合是非挑戰" },
            { q: "當我思念住在外縣市的姑姑時，我不需在意時間，可以直接打電話給她表達心意。", type: "tf", a: 1, category: "大題一、綜合是非挑戰" },
            { q: "每個人對工作意義的解讀都相同，都只是為了賺錢買喜歡的東西。", type: "tf", a: 1, category: "大題一、綜合是非挑戰" },
            { q: "能品嘗到美味的排骨飯，是因為不同工作人員互相合作，所以每個工作對社會都有重要的貢獻。", type: "tf", a: 0, category: "大題一、綜合是非挑戰" },
            { q: "安全的將乘客載運到目的地是公車司機應該做的事，不需要對他們的付出心懷感激。", type: "tf", a: 1, category: "大題一、綜合是非挑戰" },
            { q: "溝通像練習傳接球一樣，不只「說」，也要「聽」。", type: "tf", a: 0, category: "大題一、綜合是非挑戰" },
            { q: "我們和別人溝通的時候，不但要面帶微笑，也要注意對方的感受。", type: "tf", a: 0, category: "大題一、綜合是非挑戰" },
            { q: "當我們和家人溝通時，應該真誠的表達自己的感受，並強迫家人接受自己的想法。", type: "tf", a: 1, category: "大題一、綜合是非挑戰" },
            { q: "中午用餐時，裝飾環境、鋪桌巾和播放音樂等創意好點子，都能讓用餐氣氛更愉快。", type: "tf", a: 0, category: "大題一、綜合是非挑戰" },
            { q: "參加阿姨的婚禮時，我可以因為她最疼我，就直接穿著休閒舒適的睡衣參加。", type: "tf", a: 1, category: "大題一、綜合是非挑戰" },
            { q: "安安收到來路不明的簡訊連結，他可以怎麼分辨真假？", type: "mc", opts: ["撥打165反詐騙專線詢問", "直接點開連結求證", "請同學點開連結確認", "回覆簡訊詢問真假"], a: 0, category: "大題二、綜合選擇考驗" },
            { q: "下列哪一種工作與製作出排骨飯的關聯最少？", type: "mc", opts: ["養豬場裡的工人", "運送食材的貨運司機", "種稻的農夫", "寫遊戲程式的工程師"], a: 3, category: "大題二、綜合選擇考驗" },
            { q: "許多工作人員和我們的生活息息相關，下面哪個方式「不適合」用來表達感謝？", type: "mc", opts: ["對他們說謝謝", "給他們添麻煩搗亂", "做出體貼的行為", "寫感謝小卡"], a: 1, category: "大題二、綜合選擇考驗" },
            { q: "下課時間，小米想看書，同學卻在旁邊嬉鬧，小米如何處理比較合適？", type: "mc", opts: ["把同學趕出教室", "用力拍桌子大罵", "客氣的請同學保持安靜", "和同學互不相讓起爭執"], a: 2, category: "大題二、綜合選擇考驗" },
            { q: "媽媽誤會阿偉一直在看電視沒做功課，阿偉該怎麼和媽媽溝通比較合適？", type: "mc", opts: ["和媽媽大吵一架", "躲在房間生悶氣", "語氣溫和的向媽媽說明原因", "躺在地上大哭大鬧"], a: 2, category: "大題二、綜合選擇考驗" },
            { q: "下列哪一種情況是因應天氣變化而呈現出美的普遍性？", type: "mc", opts: ["冬天時行人大多穿著厚外套", "參加婚禮時大家穿著不同顏色的禮服", "爬山時有人戴帽子，有人戴頭巾", "下雨時有人穿雨衣，有人撐傘"], a: 0, category: "大題二、綜合選擇考驗" },
            { q: "琪琪和家人趁著晴天到戶外爬山，但當天寒流來襲氣溫偏低，哪一個人的穿搭最適合？", type: "mc", opts: ["哥哥穿著短褲", "琪琪戴上毛帽", "爸爸穿上西裝", "媽媽穿上高跟鞋"], a: 1, category: "大題二、綜合選擇考驗" },
            { q: "哥哥想去打羽球，他可以運用哪一項資源來解決？", type: "mc", opts: ["圖書館", "藥局", "文化中心", "國民運動中心"], a: 3, category: "大題三、資源小達人" },
            { q: "如芸想借圖鑑，她可以運用哪一項資源來解決？", type: "mc", opts: ["圖書館", "藥局", "文化中心", "國民運動中心"], a: 0, category: "大題三、資源小達人" },
            { q: "弟弟想看展覽，他可以運用哪一項資源來解決？", type: "mc", opts: ["圖書館", "藥局", "文化中心", "國民運動中心"], a: 2, category: "大題三、資源小達人" },
            { q: "奶奶需要吃藥，她可以運用哪一項資源來解決？", type: "mc", opts: ["圖書館", "藥局", "文化中心", "國民運動中心"], a: 1, category: "大題三、資源小達人" },

            { q: "在玩具店上班時，可以盡情玩玩具不工作。", type: "tf", a: 1, category: "大題七、玩具店打工觀察" },
            { q: "玩具店店員可能要幫忙客人訂購限定版玩具。", type: "tf", a: 0, category: "大題七、玩具店打工觀察" },
            { q: "玩具店裡的倉庫整理起來很辛苦。", type: "tf", a: 0, category: "大題七、玩具店打工觀察" },
            { q: "在玩具店工作，不用負責整理店內的環境。", type: "tf", a: 1, category: "大題七、玩具店打工觀察" },
            { q: "把寶特瓶改造成筆筒，是發揮創意再利用的好做法。", type: "tf", a: 0, category: "大題八、寶特瓶創意再利用" },
            { q: "將寶特瓶做成沙鈴等小樂器，是愛護環境的表現。", type: "tf", a: 0, category: "大題八、寶特瓶創意再利用" },
            { q: "寶特瓶隨手亂丟就好，反正有人會幫忙撿。", type: "tf", a: 1, category: "大題八、寶特瓶創意再利用" },
            { q: "在寶特瓶蓋上打洞變成澆花工具，是很有創意的再利用方式。", type: "tf", a: 0, category: "大題八、寶特瓶創意再利用" },
            { q: "把寶特瓶裁剪成漏斗或做成存錢筒，能減少垃圾對環境的傷害。", type: "tf", a: 0, category: "大題八、寶特瓶創意再利用" }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let currentScore = 0;
        let currentSeat = '';
        let startTime = 0;
        let timerInterval = null;
        let isAnswering = false;
        
        let firebaseApp, auth, db, currentUser;
        let cloudLeaderboard = [];

        // 🌟 老師請看這裡！這裡是關鍵！
        // =========================================================================
        const firebaseConfig = {
            // 1. 貼上您的 apiKey:
            apiKey: "AIzaSyD8jjaj6if9PwJ3ULZUBRZNUVxMJICQXro",
            // 2. 貼上您的 authDomain:
            authDomain: "classtest-game.firebaseapp.com",
            // 3. 貼上您的 projectId:
            projectId: "classtest-game",
            // 4. 貼上您的 storageBucket:
            storageBucket: "classtest-game.firebasestorage.app",
            // 5. 貼上您的 messagingSenderId (純數字):
            messagingSenderId: "830390536169",
            // 6. 貼上您的 appId:
            appId: "1:830390536169:web:50f735890acfccf61f2d78"
        };
        // =========================================================================

        try {
            if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("您的")) {
                firebaseApp = initializeApp(firebaseConfig);
                auth = getAuth(firebaseApp);
                db = getFirestore(firebaseApp);

                // 使用匿名登入 (請確保 Firebase 後臺有開啟 Anonymous 登入)
                signInAnonymously(auth).catch((error) => {
                    console.error("匿名登入失敗! 請問 Firebase 後臺有開啟匿名登入嗎？", error);
                    document.getElementById('btn-lb-text').innerText = "連線失敗(請檢查權限)";
                });

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) {
                        setupCloudListener();
                        document.getElementById('btn-lb-text').innerText = "查看全班連線榜";
                    } else {
                        document.getElementById('btn-lb-text').innerText = "尚未連線";
                    }
                });
            } else {
                console.warn("⚠️ 尚未填寫 Firebase 金鑰，目前為單機測試模式。");
                document.getElementById('btn-lb-text').innerText = "排行榜 (單機模式)";
            }
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
            document.getElementById('btn-lb-text').innerText = "連線發生錯誤";
        }

        // 設置即時監聽雲端資料庫
        function setupCloudListener() {
            if (!currentUser) return;
            
            // ⚠️ 這裡就是決定成績寫在哪個黑板的地方！
            // 由於這是「綜合活動」，我幫您命名為 "leaderboard_comprehensive"
            // (如果您之後要做健體，請把這裡改成 "leaderboard_health")
            const lbCollection = collection(db, 'leaderboard_comprehensive');
            
            onSnapshot(lbCollection, (snapshot) => {
                cloudLeaderboard = [];
                snapshot.forEach(doc => {
                    cloudLeaderboard.push(doc.data());
                });
                
                cloudLeaderboard.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.time - b.time;
                });
                
                renderLeaderboard();
            }, (error) => {
                console.error("讀取雲端排行榜發生錯誤! 請問 Rules 有設為 allow read, write: if true 嗎？", error);
                document.getElementById('btn-lb-text').innerText = "讀取權限錯誤";
            });
        }

        // 上傳成績到雲端
        async function saveScoreToCloud(seat, score, time) {
            if (!currentUser) {
                // 單機模式備用邏輯
                const existing = cloudLeaderboard.find(e => e.seat === seat);
                if (existing) {
                    if (score > existing.score || (score === existing.score && time < existing.time)) {
                        existing.score = score;
                        existing.time = time;
                    }
                } else {
                    cloudLeaderboard.push({ seat, score, time });
                }
                cloudLeaderboard.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.time - b.time;
                });
                return;
            }

            try {
                const existing = cloudLeaderboard.find(e => e.seat === seat);
                if (existing) {
                    if (score < existing.score || (score === existing.score && time >= existing.time)) {
                        return; // 成績沒有進步，不更新雲端
                    }
                }
                
                // ⚠️ 寫入成績的地方，也要對應上面的黑板名稱！
                const docRef = doc(db, 'leaderboard_comprehensive', seat);
                await setDoc(docRef, { seat, score, time });
                console.log(`✅ 座號 ${seat} 的成績上傳成功！`);
            } catch (error) {
                console.error("❌ 上傳成績到雲端失敗:", error);
                alert("成績上傳失敗！請老師檢查 Firebase 權限設定。");
            }
        }

        // --- 以下為遊戲邏輯 (不變) ---
        function shuffleArray(array) {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}分 ${s}秒`;
        }

        window.showScreen = function(screenId) {
            const screens = ['screen-login', 'screen-playing', 'screen-result', 'screen-leaderboard'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (id === screenId) {
                    el.classList.add('active');
                    el.classList.remove('fade-in');
                    void el.offsetWidth; 
                    el.classList.add('fade-in');
                } else {
                    el.classList.remove('active');
                }
            });

            if (screenId === 'screen-login') {
                document.getElementById('seat-input').value = '';
                document.getElementById('login-error').style.display = 'none';
            } else if (screenId === 'screen-leaderboard') {
                renderLeaderboard();
            }
        }

        window.startGame = function() {
            const seatInput = document.getElementById('seat-input').value.trim();
            const errorMsg = document.getElementById('login-error');
            
            if (!seatInput) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';
            currentSeat = seatInput;

            currentQuestions = shuffleArray(quizDataDB);
            
            currentIndex = 0;
            currentScore = 0;
            isAnswering = false;
            
            window.showScreen('screen-playing');
            
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timer-display').innerText = formatTime(elapsed);
            }, 1000);

            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('question-counter').innerText = `第 ${currentIndex + 1} / 50 題`;
            document.getElementById('question-category-tag').innerText = q.category;
            document.getElementById('question-type-tag').innerText = q.type === 'tf' ? '是非題' : '選擇題';
            document.getElementById('question-text').innerText = q.q;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            document.getElementById('question-box').style.borderColor = '#f5d0fe';
            document.getElementById('feedback-overlay').classList.remove('show');

            if (q.type === 'tf') {
                optsContainer.className = 'options-grid grid-2';
                
                const btnO = document.createElement('button');
                btnO.className = "btn-3d btn-tf-o";
                btnO.innerText = 'O';
                btnO.onclick = () => window.handleAnswer(0);
                
                const btnX = document.createElement('button');
                btnX.className = "btn-3d btn-tf-x";
                btnX.innerText = 'X';
                btnX.onclick = () => window.handleAnswer(1);

                optsContainer.appendChild(btnO);
                optsContainer.appendChild(btnX);
            } else {
                optsContainer.className = 'options-grid grid-2';
                
                q.opts.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "btn-3d btn-mc";
                    btn.onclick = () => window.handleAnswer(idx);
                    
                    const numSpan = document.createElement('span');
                    numSpan.className = "mc-num";
                    numSpan.innerText = idx + 1;
                    
                    const textSpan = document.createElement('span');
                    textSpan.innerText = opt;
                    
                    btn.appendChild(numSpan);
                    btn.appendChild(textSpan);
                    optsContainer.appendChild(btn);
                });
            }
            isAnswering = false;
        }

        window.handleAnswer = function(selectedIndex) {
            if (isAnswering) return;
            isAnswering = true;

            const q = currentQuestions[currentIndex];
            const isCorrect = selectedIndex === q.a;
            
            if (isCorrect) currentScore += 2;

            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');
            const qBox = document.getElementById('question-box');

            if (isCorrect) {
                overlay.className = "feedback-overlay show feedback-correct";
                icon.innerText = '✅';
                text.innerText = '答對了！';
                qBox.style.borderColor = '#4ade80';
            } else {
                overlay.className = "feedback-overlay show feedback-wrong";
                icon.innerText = '❌';
                text.innerText = '答錯了！';
                qBox.style.borderColor = '#f87171';
            }

            setTimeout(() => {
                if (currentIndex + 1 < currentQuestions.length) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    finishGame();
                }
            }, 800);
        }

        async function finishGame() {
            clearInterval(timerInterval);
            const finalTime = Math.floor((Date.now() - startTime) / 1000);
            
            await saveScoreToCloud(currentSeat, currentScore, finalTime);

            document.getElementById('final-score').innerText = currentScore;
            document.getElementById('final-time').innerText = formatTime(finalTime);
            window.showScreen('screen-result');
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            
            if (cloudLeaderboard.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 30px; color: #94a3b8; font-weight:bold;">目前榜單空空如也，趕快搶下全班第一！</td></tr>`;
                return;
            }

            cloudLeaderboard.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                let rankHtml = `<span style="color:#94a3b8">${idx + 1}</span>`;
                if (idx === 0) rankHtml = '🥇';
                if (idx === 1) rankHtml = '🥈';
                if (idx === 2) rankHtml = '🥉';

                tr.innerHTML = `
                    <td style="text-align:center;">${rankHtml}</td>
                    <td style="text-align:center;">${entry.seat}</td>
                    <td style="text-align:center; color:#c026d3;">${entry.score}</td>
                    <td style="text-align:center; color:#64748b; font-size:18px;">${formatTime(entry.time)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('seat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                window.startGame();
            }
        });
    </script>
