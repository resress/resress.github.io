const $=id=>document.getElementById(id);
const allEntries=[];
lessons.forEach((lesson,li)=>lesson.chars.forEach((group,ci)=>group.readings.forEach((entry,ri)=>allEntries.push(Object.assign({},entry,{char:group.char,lessonIndex:li,charIndex:ci,readingIndex:ri,lessonTitle:lesson.title})))));
const STORAGE_KEY="zhuyin-rpg-polyphone-v1";
function initialProgress(){return{completed:[],best:{},xp:0,finalPerfect:false};}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&Array.isArray(x.completed)&&x.best)return Object.assign(initialProgress(),x);}catch(e){}return initialProgress();}
let progress=loadProgress(),session=null;
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function unlocked(i){return i===0||progress.completed.includes(i-1);}
function updateStats(){ $("completedStat").textContent=progress.completed.length+" / 6";const learned=progress.completed.reduce((n,i)=>n+lessons[i].chars.reduce((m,g)=>m+g.readings.length,0),0);$("soundStat").textContent=learned+" / 31";$("xpStat").textContent=String(progress.xp);const open=progress.completed.length===6;$("finalBtn").disabled=!open;$("finalBtn").textContent=open?(progress.finalPerfect?"再挑戰龍王　✦":"挑戰龍王　➜"):"尚未解鎖";$("finalDescription").textContent=open?"六座村莊都已完成！用 31 個讀音挑戰混音龍王。":"完成六座村莊，就能挑戰全部 31 個讀音！";}
function renderMap(){$("mapGrid").innerHTML=lessons.map((l,i)=>{const done=progress.completed.includes(i),open=unlocked(i),n=l.chars.reduce((x,g)=>x+g.readings.length,0);return'<article class="lesson-card"><div class="chapter">村莊 '+(i+1)+' · 第 '+(i+1)+' 課</div><h3>📍 '+esc(l.title)+'</h3><p>'+l.chars.map(g=>g.char).join("、")+'　·　'+n+' 個讀音</p><div class="lesson-foot"><span class="badge '+(!open?"locked":"")+'">'+(done?"✦ 已完成":open?"可前往":"🔒 未解鎖")+'</span><button class="btn small '+(open?"primary":"")+'" type="button" data-lesson="'+i+'" '+(!open?"disabled":"")+'>'+(done?"再練習":"進村莊")+'</button></div></article>';}).join("");$("mapGrid").querySelectorAll("[data-lesson]").forEach(b=>b.addEventListener("click",()=>startLesson(Number(b.dataset.lesson))));updateStats();}
function show(view){$("mapView").classList.toggle("hidden",view!=="map");$("gameView").classList.toggle("hidden",view!=="game");if(view==="map")renderMap();window.scrollTo({top:0,behavior:"smooth"});}
function setupGame(title,eyebrow){$("questTitle").textContent=title;$("questEyebrow").textContent=eyebrow;$("studyPanel").classList.remove("hidden");$("quizPanel").classList.add("hidden");$("resultPanel").classList.add("hidden");$("progressFill").style.width="0%";show("game");}
function startLesson(i){if(!unlocked(i))return;const l=lessons[i];session={mode:"lesson",lessonIndex:i,questions:shuffle(allEntries.filter(e=>e.lessonIndex===i)),index:0,wrong:false,answered:false,firstTry:0,xp:0};setupGame(l.title,"村莊 "+(i+1)+" · 第 "+(i+1)+" 課");renderStudy(l);}
function renderStudy(l){const cards=l.chars.map(g=>'<article class="study-card"><h3><span class="character">'+esc(g.char)+'</span> 的讀音</h3>'+g.readings.map(r=>'<div class="sound-line"><span class="sound">'+esc(r.sound)+'</span><span class="word">'+esc(r.word)+'</span><span class="meaning">'+esc(r.meaning)+'</span><p class="example">例句：'+esc(r.sentence)+'</p></div>').join("")+'</article>').join("");const n=l.chars.reduce((x,g)=>x+g.readings.length,0);$("studyPanel").innerHTML='<div class="study-intro"><strong>🗺️ 探索讀音線索</strong><p>先讀完每張卡片，留意詞語和句子的意思。接著挑戰本村莊的 '+n+' 題；答錯可以看提示再試，不扣分。</p></div><div class="study-grid">'+cards+'</div><div class="study-bottom"><span class="badge">本課 '+l.chars.length+' 個多音字 · '+n+' 種讀音</span><button class="btn primary" id="startQuizBtn" type="button">讀音線索記住了，開始挑戰 ➜</button></div>';$("startQuizBtn").addEventListener("click",startQuiz);}
function startQuiz(){session.index=0;session.wrong=false;session.answered=false;$("studyPanel").classList.add("hidden");$("quizPanel").classList.remove("hidden");renderQuestion();}
function markedSentence(q){const s=esc(q.sentence),w=esc(q.word),i=s.indexOf(w);return i<0?s:s.slice(0,i)+"<mark>"+w+"</mark>"+s.slice(i+w.length);}
function renderQuestion(){const q=session.questions[session.index],total=session.questions.length; $("progressFill").style.width=(session.index/total*100)+"%";const opts=shuffle([...new Set(allEntries.filter(e=>e.char===q.char).map(e=>e.sound))]);$("quizPanel").innerHTML='<div class="quiz-card"><div class="question-count">'+(session.mode==="final"?"混音龍王":"村莊挑戰")+'　·　第 '+(session.index+1)+' / '+total+' 題</div><p class="sentence">「'+markedSentence(q)+'」</p><p class="question">請選出「<strong>'+esc(q.word)+'</strong>」裡「<strong>'+esc(q.char)+'</strong>」的正確讀音。</p><div class="choices" id="choices"></div><div class="feedback hidden" id="feedback" role="status"></div><div style="margin-top:15px"><button class="btn primary hidden" id="nextBtn" type="button">下一題　➜</button></div></div>';const choices=$("choices");opts.forEach(sound=>{const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=sound;b.setAttribute("aria-label","讀音 "+sound);b.addEventListener("click",()=>answer(sound,b));choices.appendChild(b);});}
function answer(sound,button){if(session.answered)return;const q=session.questions[session.index],f=$("feedback");f.classList.remove("hidden","good","retry");if(sound===q.sound){session.answered=true;session.xp+=session.wrong?10:20;if(!session.wrong)session.firstTry++;button.classList.add("selected-correct");$("choices").querySelectorAll("button").forEach(b=>b.disabled=true);f.classList.add("good");f.innerHTML="<strong>答對了！✨</strong>"+esc(q.explain);$("nextBtn").classList.remove("hidden");$("nextBtn").addEventListener("click",advance,{once:true});}else{session.wrong=true;button.classList.add("selected-wrong");button.disabled=true;f.classList.add("retry");f.innerHTML="<strong>再找找線索，不扣分喔！</strong>"+esc(q.hint);}}
function advance(){session.index++;if(session.index>=session.questions.length){session.mode==="final"?finishFinal():finishLesson();}else{session.wrong=false;session.answered=false;renderQuestion();}}
function finishLesson(){const i=session.lessonIndex,l=lessons[i],total=session.questions.length,score=session.xp;if(!progress.completed.includes(i))progress.completed.push(i);progress.completed.sort((a,b)=>a-b);progress.xp+=score;progress.best[i]=Math.max(progress.best[i]||0,session.firstTry);saveProgress();$("studyPanel").classList.add("hidden");$("quizPanel").classList.add("hidden");$("resultPanel").classList.remove("hidden");$("progressFill").style.width="100%";const msg=i<5?"下一座村莊已開啟，可以繼續冒險！":"六座村莊都完成了，混音龍王已出現！";$("resultPanel").innerHTML='<div class="quest-result"><div class="result-icon">🏅</div><div class="eyebrow">村莊任務完成</div><h2>太棒了，你點亮了「'+esc(l.title)+'」！</h2><div class="result-score">首次答對 '+session.firstTry+' / '+total+' 題</div><div class="result-score">獲得 '+score+' 顆勇者星星</div><p>'+msg+'</p><button class="btn primary" id="resultMapBtn" type="button">回冒險地圖</button></div>';$("resultMapBtn").addEventListener("click",()=>{session=null;show("map");});}
function startFinal(){if(progress.completed.length!==6)return;session={mode:"final",lessonIndex:null,questions:shuffle(allEntries),index:0,wrong:false,answered:false,firstTry:0,xp:0};setupGame("混音龍王的 31 音試煉","最終任務 · 全部六課");$("studyPanel").innerHTML='<div class="study-intro"><strong>🐉 混音龍王來了！</strong><p>31 個讀音混在一起，仔細看句子和詞語，選出目標字的讀音。答錯可看提示再試，勇者不會被扣分。</p></div><div style="text-align:center;padding:20px"><div style="font-size:4rem">🐲</div><button class="btn gold" id="startFinalBtn" type="button">我準備好了，開始試煉 ➜</button></div>';$("startFinalBtn").addEventListener("click",()=>{$("studyPanel").classList.add("hidden");$("quizPanel").classList.remove("hidden");renderQuestion();});}
function finishFinal(){const total=session.questions.length,perfect=session.firstTry===total,score=session.xp;progress.xp+=score;progress.finalPerfect=progress.finalPerfect||perfect;saveProgress();$("quizPanel").classList.add("hidden");$("resultPanel").classList.remove("hidden");$("progressFill").style.width="100%";$("resultPanel").innerHTML='<div class="quest-result"><div class="result-icon">'+(perfect?"👑":"🐲")+'</div><div class="eyebrow">混音龍王試煉完成</div><h2>'+(perfect?"你成為多音字王國的聲音勇者！":"龍王被你的努力打動了！")+'</h2><div class="result-score">首次答對 '+session.firstTry+' / '+total+' 題</div><div class="result-score">獲得 '+score+' 顆勇者星星</div><p>'+(perfect?"31 個讀音都一次答對，太厲害了！":"所有題目都完成了；想再練習，可以重返圖鑑或再次挑戰。")+'</p><button class="btn primary" id="finalMapBtn" type="button">回冒險地圖</button></div>';$("finalMapBtn").addEventListener("click",()=>{session=null;show("map");});}
function openAtlas(){$("atlasContent").innerHTML=lessons.map((l,i)=>'<section class="atlas-section"><h3>第 '+(i+1)+' 課《'+esc(l.title)+'》</h3><div class="atlas-words">'+l.chars.map(g=>'<div class="atlas-word"><strong>'+esc(g.char)+'</strong>　'+g.readings.map(r=>esc(r.sound)+"（"+esc(r.word)+"）").join("／")+'</div>').join("")+'</div></section>').join("");$("atlasOverlay").classList.remove("hidden");$("closeAtlasBtn").focus();}
function closeAtlas(){$("atlasOverlay").classList.add("hidden");$("atlasBtn").focus();}
$("beginBtn").addEventListener("click",()=>$("mapGrid").scrollIntoView({behavior:"smooth",block:"start"}));
$("mapBtn").addEventListener("click",()=>{session=null;show("map");});
$("finalBtn").addEventListener("click",startFinal);
$("atlasBtn").addEventListener("click",openAtlas);
$("closeAtlasBtn").addEventListener("click",closeAtlas);
$("atlasOverlay").addEventListener("click",e=>{if(e.target===$("atlasOverlay"))closeAtlas();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("atlasOverlay").classList.contains("hidden"))closeAtlas();});
$("resetBtn").addEventListener("click",()=>{if(confirm("確定要清除這台裝置上的遊戲進度嗎？")){progress=initialProgress();saveProgress();renderMap();}});
renderMap();
</script>
</body>
</html>
