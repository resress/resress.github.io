<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考試計時電子看板</title>
  
  <!-- 引入 Tailwind CSS (這是一個讓我們可以快速排版的魔法棒) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Phosphor Icons (漂亮的小圖示) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    /* 這裡定義一些平滑的動畫效果 */
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* 確保數字跳動時不會左右晃動 (等寬數字) */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    
    /* 讓整個畫面不可選取文字，避免老師不小心反白 */
    body {
      user-select: none;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-slate-50 to-indigo-100 transition-colors duration-1000 font-sans min-h-screen flex flex-col text-slate-800" id="app-body">

  <!-- 頂部資訊列 (現在時間) -->
  <header class="w-full px-6 py-4 flex justify-between items-center bg-white/80 backdrop-blur-md shadow-sm z-10 relative">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 p-2 rounded-lg text-white">
        <i class="ph ph-clock text-2xl"></i>
      </div>
      <span class="text-2xl font-bold tracking-wider text-blue-900" id="current-time-display">
        --:--:--
      </span>
    </div>
    
    <div id="settings-label" class="flex items-center text-slate-500 font-medium bg-slate-100 px-4 py-2 rounded-full transition-opacity duration-300">
      <i class="ph-fill ph-gear text-xl mr-2"></i>
      考程控制中心
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-grow flex flex-col items-center justify-center p-4 md:p-8 relative">
    
    <!-- === 控制中心 (排程設定) === -->
    <div id="schedule-view" class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-8 fade-in absolute z-20">
      
      <!-- 左側：新增考試 -->
      <div class="md:col-span-1 bg-white p-6 rounded-3xl shadow-xl border border-slate-100 h-fit">
        <div class="flex items-center mb-6 text-blue-600">
          <i id="form-icon" class="ph-bold ph-plus text-2xl mr-2"></i>
          <h2 id="form-title" class="text-2xl font-bold text-slate-800">新增考程</h2>
        </div>
        
        <form id="add-exam-form" onsubmit="handleAddExam(event)" class="space-y-5">
          <div>
            <label class="block text-slate-600 font-bold mb-2 text-sm">科目名稱</label>
            <input 
              type="text" 
              id="new-subject"
              class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-lg"
              placeholder="例如：第三節 自然"
              required
            >
          </div>

          <div>
            <label class="block text-slate-600 font-bold mb-2 text-sm flex justify-between">
              <span>時間 (分鐘)</span>
              <span class="text-blue-500 cursor-pointer hover:underline" onclick="document.getElementById('new-duration').value = 40">預設 40 分</span>
            </label>
            <input 
              type="number" 
              id="new-duration"
              value="40"
              class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-lg"
              min="1"
              required
            >
          </div>

          <div class="flex gap-2">
            <button 
              type="submit"
              id="submit-btn"
              class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-lg transition-all shadow-md hover:shadow-blue-500/40 flex justify-center items-center"
            >
              加入清單
            </button>
            <button 
              type="button"
              id="cancel-btn"
              onclick="cancelEdit()"
              class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-xl text-lg transition-all"
            >
              取消
            </button>
          </div>
        </form>
      </div>

      <!-- 右側：今日考程清單 -->
      <div class="md:col-span-2 bg-white p-6 md:p-8 rounded-3xl shadow-xl border border-slate-100">
        <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
          <div class="flex items-center text-indigo-600">
            <i class="ph-fill ph-list-dashes text-3xl mr-3"></i>
            <h2 class="text-2xl font-bold text-slate-800">今日考程表</h2>
          </div>
          <span id="exam-count" class="bg-indigo-100 text-indigo-700 py-1 px-3 rounded-full text-sm font-bold">
            共 0 節
          </span>
        </div>

        <div id="schedule-list" class="space-y-4 max-h-[50vh] overflow-y-auto pr-2">
          <!-- 考程列表會由 JavaScript 動態產生 -->
        </div>
      </div>
    </div>

    <!-- === 考試進行中畫面 (大螢幕專注模式) === -->
    <div id="exam-view" class="flex flex-col items-center w-full text-center hidden opacity-0 transition-opacity duration-500 absolute z-10">
      
      <div class="bg-white/60 backdrop-blur-sm px-8 py-4 rounded-full mb-8 shadow-sm border border-white">
        <h1 id="display-subject" class="text-5xl md:text-7xl font-black text-slate-800 tracking-wide">
          --
        </h1>
      </div>
      
      <div id="display-timer" class="text-[10rem] md:text-[18rem] leading-none font-black tabular-nums tracking-tighter text-emerald-500 drop-shadow-md transition-colors duration-500">
        00:00
      </div>

      <div id="warning-message" class="h-20 mt-4 transition-opacity duration-500 opacity-0">
        <div class="flex items-center text-4xl font-bold text-amber-600 animate-pulse bg-amber-100/80 px-8 py-3 rounded-full">
          <i class="ph-fill ph-warning-circle text-5xl mr-3"></i>
          最後 10 分鐘，請檢查考卷！
        </div>
      </div>

      <div class="mt-12 absolute bottom-[-5rem] opacity-30 hover:opacity-100 transition-opacity duration-300">
        <div class="bg-white px-8 py-4 rounded-2xl shadow-lg flex items-center gap-8 border border-slate-100">
            <div class="text-xl font-bold text-slate-600">
            預計結束時間：<span id="display-end-time">--:--</span>
            </div>
            <button 
            onclick="handleStopExam()"
            class="bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 font-bold py-2 px-6 rounded-xl text-lg flex items-center transition-all"
            >
            <i class="ph-fill ph-stop-circle text-2xl mr-2 group-hover:text-red-500"></i>
            結束本科並返回
            </button>
        </div>
      </div>

    </div>
  </main>

  <script>
    // --- 狀態與資料 ---
    // 我幫您預設好了兩科，您可以隨時刪除或新增
    let schedule = [
      { id: 1, subject: '第一節：國語期中考', duration: 40, status: 'pending' },
      { id: 2, subject: '第二節：數學期中考', duration: 40, status: 'pending' }
    ];
    let activeExamId = null;
    let examTimerInterval = null;
    let targetEndTime = null;
    let editingId = null; // 新增：用來記錄目前正在編輯的考試 ID

    // --- DOM 元件 ---
    const appBody = document.getElementById('app-body');
    const scheduleView = document.getElementById('schedule-view');
    const examView = document.getElementById('exam-view');
    const settingsLabel = document.getElementById('settings-label');
    const scheduleListEl = document.getElementById('schedule-list');
    const examCountEl = document.getElementById('exam-count');
    
    const displaySubject = document.getElementById('display-subject');
    const displayTimer = document.getElementById('display-timer');
    const displayEndTime = document.getElementById('display-end-time');
    const warningMessage = document.getElementById('warning-message');

    // --- 時鐘邏輯 ---
    function updateClock() {
      const now = new Date();
      document.getElementById('current-time-display').innerText = 
        now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 排程清單渲染邏輯 ---
    function renderSchedule() {
      examCountEl.innerText = `共 ${schedule.length} 節`;
      
      if (schedule.length === 0) {
        scheduleListEl.innerHTML = `
          <div class="text-center py-12 text-slate-400 flex flex-col items-center">
            <i class="ph ph-timer text-6xl mb-4 opacity-50"></i>
            <p class="text-lg">目前沒有安排考試喔！</p>
            <p class="text-sm mt-2">請從左側新增您今天要考的科目</p>
          </div>
        `;
        return;
      }

      scheduleListEl.innerHTML = schedule.map(exam => {
        const isCompleted = exam.status === 'completed';
        return `
          <div class="flex items-center justify-between p-4 rounded-2xl border-2 transition-all ${
            isCompleted 
            ? 'bg-slate-50 border-slate-200 opacity-60' 
            : 'bg-white border-blue-100 hover:border-blue-300 shadow-sm hover:shadow-md'
          }">
            <div class="flex items-center gap-4">
              ${isCompleted 
                ? `<i class="ph-fill ph-check-circle text-4xl text-emerald-500"></i>` 
                : `<div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg">${exam.duration}</div>`
              }
              <div>
                <h3 class="text-xl font-bold ${isCompleted ? 'text-slate-500 line-through' : 'text-slate-800'}">
                  ${exam.subject}
                </h3>
                <p class="text-sm text-slate-500">${exam.duration} 分鐘</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              ${!isCompleted ? `
                <button 
                  onclick="handleStartExam(${exam.id})"
                  class="bg-emerald-500 hover:bg-emerald-600 text-white p-3 rounded-xl font-bold flex items-center transition-colors shadow-sm"
                  title="開始這節考試"
                >
                  <i class="ph-fill ph-play-circle text-xl md:mr-1"></i>
                  <span class="hidden md:inline">開始</span>
                </button>
                <button 
                  onclick="handleEditExam(${exam.id})"
                  class="p-3 text-slate-400 hover:text-blue-500 hover:bg-blue-50 rounded-xl transition-colors"
                  title="編輯"
                >
                  <i class="ph ph-pencil-simple text-xl"></i>
                </button>
              ` : ''}
              <button 
                onclick="handleRemoveExam(${exam.id})"
                class="p-3 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors"
                title="刪除"
              >
                <i class="ph ph-trash text-xl"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- 新增 / 刪除考試 ---
    function handleAddExam(e) {
      e.preventDefault();
      const subjectInput = document.getElementById('new-subject');
      const durationInput = document.getElementById('new-duration');
      
      if (!subjectInput.value.trim()) return;

      if (editingId) {
        // 編輯模式：更新現有資料
        const exam = schedule.find(e => e.id === editingId);
        if (exam) {
          exam.subject = subjectInput.value.trim();
          exam.duration = parseInt(durationInput.value) || 40;
        }
        cancelEdit(); // 儲存後重置表單為新增模式
      } else {
        // 新增模式：加入新資料
        const newExam = {
          id: Date.now(),
          subject: subjectInput.value.trim(),
          duration: parseInt(durationInput.value) || 40,
          status: 'pending'
        };
        schedule.push(newExam);
        subjectInput.value = ''; // 清空輸入框
        durationInput.value = '40';
      }
      
      renderSchedule();
    }

    // 啟動編輯模式
    function handleEditExam(id) {
      const exam = schedule.find(e => e.id === id);
      if (!exam) return;
      
      editingId = id;
      document.getElementById('new-subject').value = exam.subject;
      document.getElementById('new-duration').value = exam.duration;
      
      // 改變左側表單外觀為「編輯模式」
      document.getElementById('form-title').innerText = '編輯考程';
      document.getElementById('form-icon').className = 'ph-bold ph-pencil-simple text-2xl mr-2';
      document.getElementById('submit-btn').innerText = '儲存修改';
      // 換成橘黃色按鈕比較有提醒作用
      document.getElementById('submit-btn').className = 'flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl text-lg transition-all shadow-md hover:shadow-amber-500/40 flex justify-center items-center';
      document.getElementById('cancel-btn').classList.remove('hidden');
    }

    // 取消編輯模式
    function cancelEdit() {
      editingId = null;
      document.getElementById('new-subject').value = '';
      document.getElementById('new-duration').value = '40';
      
      // 恢復左側表單外觀為「新增模式」
      document.getElementById('form-title').innerText = '新增考程';
      document.getElementById('form-icon').className = 'ph-bold ph-plus text-2xl mr-2';
      document.getElementById('submit-btn').innerText = '加入清單';
      // 換回原本的藍色按鈕
      document.getElementById('submit-btn').className = 'flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-lg transition-all shadow-md hover:shadow-blue-500/40 flex justify-center items-center';
      document.getElementById('cancel-btn').classList.add('hidden');
    }

    function handleRemoveExam(id) {
      schedule = schedule.filter(exam => exam.id !== id);
      renderSchedule();
    }

    // --- 開始 / 結束考試邏輯 ---
    function handleStartExam(id) {
      const exam = schedule.find(e => e.id === id);
      if (!exam) return;

      activeExamId = id;
      displaySubject.innerText = exam.subject;
      
      const now = new Date();
      targetEndTime = new Date(now.getTime() + exam.duration * 60000);
      displayEndTime.innerText = targetEndTime.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

      // 切換畫面
      scheduleView.classList.add('opacity-0');
      settingsLabel.classList.add('opacity-0');
      
      setTimeout(() => {
        scheduleView.classList.add('hidden');
        examView.classList.remove('hidden');
        setTimeout(() => examView.classList.remove('opacity-0'), 50);
      }, 500);

      updateExamTimer();
      examTimerInterval = setInterval(updateExamTimer, 1000);
    }

    function handleStopExam() {
      clearInterval(examTimerInterval);
      
      // 標記該考試為已完成
      if (activeExamId) {
        const exam = schedule.find(e => e.id === activeExamId);
        if (exam) exam.status = 'completed';
      }
      activeExamId = null;
      targetEndTime = null;

      // 切換回設定畫面
      examView.classList.add('opacity-0');
      
      setTimeout(() => {
        examView.classList.add('hidden');
        scheduleView.classList.remove('hidden');
        setTimeout(() => {
          scheduleView.classList.remove('opacity-0');
          settingsLabel.classList.remove('opacity-0');
        }, 50);
        
        // 重置背景顏色
        appBody.className = "bg-gradient-to-br from-blue-50 via-slate-50 to-indigo-100 transition-colors duration-1000 font-sans min-h-screen flex flex-col text-slate-800";
        displayTimer.className = "text-[10rem] md:text-[18rem] leading-none font-black tabular-nums tracking-tighter text-emerald-500 drop-shadow-md transition-colors duration-500";
        warningMessage.classList.add('opacity-0');
        
        renderSchedule(); // 重新渲染清單以顯示打勾狀態
      }, 500);
    }

    // --- 倒數計時與變色 ---
    function updateExamTimer() {
      if (!activeExamId) return;

      const now = new Date();
      let differenceInSeconds = Math.floor((targetEndTime.getTime() - now.getTime()) / 1000);

      if (differenceInSeconds <= 0) {
        differenceInSeconds = 0;
        clearInterval(examTimerInterval);
        displayTimer.innerText = "時間到";
        
        displayTimer.className = "text-[10rem] md:text-[18rem] leading-none font-black tabular-nums tracking-tighter text-red-500 drop-shadow-md transition-colors duration-500";
        appBody.className = "bg-red-50 transition-colors duration-1000 font-sans min-h-screen flex flex-col text-slate-800";
        warningMessage.classList.add('opacity-0'); 
        return;
      }

      const m = Math.floor(differenceInSeconds / 60).toString().padStart(2, '0');
      const s = (differenceInSeconds % 60).toString().padStart(2, '0');
      displayTimer.innerText = `${m}:${s}`;

      if (differenceInSeconds <= 600) {
        displayTimer.className = "text-[10rem] md:text-[18rem] leading-none font-black tabular-nums tracking-tighter text-amber-500 drop-shadow-md transition-colors duration-500";
        appBody.className = "bg-amber-50 transition-colors duration-1000 font-sans min-h-screen flex flex-col text-slate-800";
        warningMessage.classList.remove('opacity-0'); 
      } else {
        displayTimer.className = "text-[10rem] md:text-[18rem] leading-none font-black tabular-nums tracking-tighter text-emerald-500 drop-shadow-md transition-colors duration-500";
        appBody.className = "bg-emerald-50 transition-colors duration-1000 font-sans min-h-screen flex flex-col text-slate-800";
        warningMessage.classList.add('opacity-0');
      }
    }

    // 初始化渲染排程清單
    renderSchedule();
  </script>
</body>
</html>
