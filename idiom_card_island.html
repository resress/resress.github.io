<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173a59">
<title>成語島探險隊</title>
<style>
:root{
  --ink:#25354a;--muted:#65758a;--paper:#fffdf7;--cream:#f5f1e7;--line:#e6decd;
  --blue:#4776bd;--blue-dark:#31588e;--mint:#dff2e7;--green:#317a57;--gold:#f2c45b;
  --coral:#d96d55;--lav:#eee9fb;--shadow:0 12px 28px rgba(49,55,66,.12);
  --radius:22px
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--cream)}
body{margin:0;color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;background:
  radial-gradient(circle at 10% 2%,rgba(255,255,255,.9),transparent 26rem),
  linear-gradient(150deg,#f8f4eb,#f1f5ed 65%,#eef3f8);min-height:100vh}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:4px solid #f2c45b;outline-offset:3px}
.shell{max-width:1100px;margin:0 auto;padding:20px clamp(14px,3vw,34px) 34px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:#fff;box-shadow:var(--shadow);font-size:28px}
h1{font-size:clamp(22px,4vw,32px);line-height:1.2;margin:0;font-weight:900;letter-spacing:.03em}
.tagline{font-size:14px;color:var(--muted);margin-top:4px}
.quiet-chip,.progress-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,247,.88);padding:9px 13px;font-size:14px;font-weight:800}
.quiet-chip{white-space:nowrap;color:#466153}
.panel{background:rgba(255,253,247,.96);border:1px solid rgba(230,222,205,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
.home-hero{padding:clamp(20px,4vw,34px);margin-bottom:18px;position:relative;overflow:hidden}
.home-hero:after{content:"✦";position:absolute;right:28px;top:16px;color:#f1cc71;font-size:54px;opacity:.7;transform:rotate(12deg)}
.eyebrow{font-size:13px;font-weight:900;color:var(--blue);letter-spacing:.12em}
.home-hero h2{font-size:clamp(24px,4vw,36px);margin:9px 0 8px;line-height:1.25}
.home-hero p{max-width:720px;color:var(--muted);font-size:17px;line-height:1.7;margin:0}
.home-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 12px}
.section-title h3{font-size:20px;margin:0}
.section-title span{font-size:14px;color:var(--muted)}
.lesson-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lesson-card{min-height:126px;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fff;padding:17px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s}
.lesson-card:hover,.mode-card:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(49,55,66,.1);border-color:#afc4dd}
.lesson-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lesson-name{font-size:18px;font-weight:900}
.lesson-icon{font-size:24px}
.lesson-desc{font-size:14px;line-height:1.55;color:var(--muted);margin-top:9px}
.mini-progress{height:7px;border-radius:99px;background:#edf0ed;overflow:hidden;margin-top:12px}
.mini-progress i{display:block;height:100%;background:linear-gradient(90deg,#76bb8d,#4d9b70);border-radius:99px}
.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode-card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:18px;text-align:left;cursor:pointer;min-height:128px;transition:transform .16s,box-shadow .16s,border-color .16s}
.mode-card strong{display:block;font-size:18px;margin-bottom:7px}
.mode-card span{display:block;color:var(--muted);font-size:14px;line-height:1.55}
.mode-icon{font-size:24px;margin-bottom:7px}
.primary,.secondary,.soft,.choice,.text-choice,.tiny-button{border:0;border-radius:15px;cursor:pointer;transition:transform .12s,filter .12s,background .12s}
.primary:active,.secondary:active,.soft:active,.choice:active,.text-choice:active,.tiny-button:active{transform:scale(.985)}
.primary{background:var(--blue);color:white;font-weight:900;padding:15px 20px;min-height:54px;box-shadow:0 6px 14px rgba(71,118,189,.22)}
.primary:hover{background:var(--blue-dark)}
.secondary{background:#edf3fb;color:var(--blue-dark);font-weight:900;padding:13px 17px;min-height:50px}
.soft{background:#f4f0e7;color:#59687a;font-weight:800;padding:12px 15px;min-height:48px}
.small-link{background:transparent;border:0;padding:10px 8px;color:var(--muted);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin:14px 2px 0}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.game-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.progress-wrap{padding:13px 16px;margin-bottom:16px}
.progress-label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:900}
.progress-track{height:10px;margin-top:10px;border-radius:99px;background:#ebeee9;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#75b98e,#3d936a);transition:width .25s}
.tabletop{padding:clamp(17px,3.2vw,28px)}
.tabletop-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.tabletop-head h2{font-size:clamp(20px,3.3vw,27px);margin:0}
.step-label{background:#eef3fb;color:var(--blue-dark);font-size:13px;font-weight:900;padding:8px 11px;border-radius:999px;white-space:nowrap}
.prompt-card{border:2px dashed #b6c9dc;border-radius:20px;background:linear-gradient(145deg,#f1f6ff,#fff);padding:clamp(19px,4vw,29px);position:relative}
.card-label{font-size:13px;font-weight:900;color:var(--blue);letter-spacing:.1em}
.prompt-text{font-size:clamp(21px,3.7vw,30px);line-height:1.65;font-weight:850;margin:12px 0 4px}
.blank{color:#5278af;white-space:nowrap}
.hint-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}
.hint-box{background:#fff8df;border:1px solid #f1dfa3;color:#68531d;border-radius:14px;padding:11px 14px;font-size:15px;line-height:1.55;flex:1;min-width:220px}
.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:17px}
.choice{min-height:90px;padding:15px 13px;background:#fff;border:2px solid #e4e7eb;box-shadow:0 4px 10px rgba(46,60,77,.05);font-size:clamp(19px,3vw,24px);font-weight:900;line-height:1.35}
.choice:hover{border-color:#9bb6d7;background:#f8fbff}
.choice.correct{background:#e5f5ea;border-color:#60a77a;color:#286646}
.choice.incorrect{background:#fff0ec;border-color:#e49782;color:#9d4333}
.feedback{margin-top:15px;padding:15px 17px;border-radius:16px;background:#f1f6ff;border:1px solid #d6e2f1;font-size:16px;line-height:1.65}
.feedback.good{background:#ebf7ef;border-color:#c7e8d1;color:#285e40}
.feedback.try{background:#fff7e8;border-color:#f0dfb3;color:#735819}
.feedback strong{font-size:18px}
.feedback-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.usage-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.text-choice{min-height:106px;text-align:left;border:2px solid #e4e7eb;background:#fff;padding:16px;border-radius:17px;font-size:17px;line-height:1.65}
.text-choice:hover{border-color:#9bb6d7;background:#f8fbff}
.text-choice.correct{background:#e5f5ea;border-color:#60a77a}
.text-choice.incorrect{background:#fff0ec;border-color:#e49782}
.text-choice .letter{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#edf3fb;color:var(--blue-dark);font-weight:900;margin-right:8px}
.idiom-display{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;background:linear-gradient(110deg,#eef6ff,#f4f1ff);border:1px solid #dfe6f2}
.idiom-seal{display:grid;place-items:center;width:54px;height:54px;flex:0 0 54px;background:white;border-radius:17px;font-size:27px;box-shadow:0 5px 12px rgba(49,55,66,.1)}
.idiom-display h3{font-size:clamp(24px,4vw,32px);margin:0}
.idiom-display p{margin:5px 0 0;color:var(--muted);font-size:16px;line-height:1.55}
.self-card{margin-top:16px;padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.self-card h3{font-size:20px;margin:0 0 8px}
.self-card p{font-size:16px;line-height:1.6;color:var(--muted);margin:0}
.example-box{background:#fff8df;border-left:5px solid var(--gold);border-radius:12px;padding:13px 15px;margin-top:13px;font-size:17px;line-height:1.65}
.button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}
.summary{padding:clamp(20px,4vw,34px);text-align:center}
.summary-badge{display:inline-grid;place-items:center;background:#fff5d4;border-radius:50%;width:80px;height:80px;font-size:42px;margin-bottom:10px}
.summary h2{font-size:clamp(25px,4vw,35px);margin:5px 0 9px}
.summary p{color:var(--muted);font-size:17px;line-height:1.65;max-width:650px;margin:0 auto}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:650px;margin:22px auto}
.stat{background:#f7f5ef;padding:15px;border-radius:16px}
.stat strong{display:block;font-size:26px}
.stat span{font-size:13px;color:var(--muted);font-weight:800}
.review-list{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px auto;max-width:720px}
.review-chip{background:#fff0ec;color:#9d4a3b;border-radius:99px;padding:8px 12px;font-weight:900;font-size:14px}
.footer-note{text-align:center;color:#788595;font-size:12px;margin-top:18px}
.hidden{display:none!important}
.fade-in{animation:appear .22s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){
  .shell{padding-top:13px}
  .topbar{align-items:flex-start}
  .quiet-chip{font-size:12px;padding:8px 10px}
  .lesson-grid,.mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .choice-grid{grid-template-columns:1fr}
  .choice{min-height:68px}
  .usage-options{grid-template-columns:1fr}
  .text-choice{min-height:78px}
  .game-top{align-items:flex-start}
}
@media(max-width:470px){
  .lesson-grid,.mode-grid{grid-template-columns:1fr}
  .brand-mark{width:45px;height:45px}
  .tagline{font-size:12px}
  .home-hero:after{right:15px;top:10px;font-size:38px}
  .home-hero p{font-size:15px}
  .tabletop-head{align-items:flex-start;flex-direction:column}
}

/* Adventure refresh: a colorful card-table world with clear touch targets. */
:root{
  --ink:#193247;--muted:#647a86;--paper:#fffdf7;--cream:#eff4ec;--line:#d9e6df;
  --blue:#2868a9;--blue-dark:#174b7d;--mint:#dff6e9;--green:#21805a;--gold:#ffd064;
  --coral:#e5795a;--lav:#eee9ff;--shadow:0 16px 38px rgba(18,48,67,.15);--radius:24px
}
body{
 background:
  radial-gradient(ellipse at 12% 8%,rgba(255,255,255,.95),transparent 25rem),
  radial-gradient(ellipse at 93% 28%,rgba(206,237,231,.7),transparent 26rem),
  linear-gradient(145deg,#eff3e9 0%,#e9f1f1 48%,#f3ecdf 100%);
 background-attachment:fixed
}
.brand-mark{
 background:linear-gradient(145deg,#ffe58a,#ffbf61);border:3px solid #fff;

}
h1{color:#153952;letter-spacing:.055em}
.tagline{color:#526e78;font-weight:700}

.panel{border:1px solid rgba(206,224,216,.9);box-shadow:0 12px 30px rgba(35,70,81,.1)}
.home-hero{
 min-height:285px;padding:clamp(25px,4.5vw,42px);margin-bottom:21px;
 color:#fff;background:linear-gradient(118deg,#173a59 0%,#24617a 55%,#337b75 100%);
 border:0;box-shadow:0 18px 40px rgba(24,68,85,.24);isolation:isolate
}
.home-hero:before{
 content:"";position:absolute;inset:0;z-index:-1;opacity:.55;
 background:
  radial-gradient(circle at 78% 28%,rgba(255,218,125,.36),transparent 8rem),
  radial-gradient(circle at 23% 120%,rgba(104,190,160,.32),transparent 16rem),

}
.home-hero:after{content:"✦  ·  ✧  ·  ✦";right:22px;top:14px;color:#ffe39b;font-size:22px;letter-spacing:14px;opacity:.8}
.home-hero h2{max-width:610px;color:#fff;font-size:clamp(28px,4.6vw,42px);text-shadow:0 3px 0 rgba(13,38,56,.16)}
.home-hero p{max-width:610px;color:#e5f4f0;font-size:17px}
.home-hero .eyebrow{color:#ffdd86}
.hero-copy{position:relative;z-index:2;max-width:68%}
.hero-art{
 position:absolute;right:3%;top:25px;width:min(30%,300px);height:225px;
 display:grid;place-items:center;z-index:1;pointer-events:none
}
.hero-glow{
 position:absolute;width:190px;height:190px;border-radius:50%;
 background:radial-gradient(circle,#ffe493 0%,rgba(255,215,120,.35) 38%,transparent 72%);
 animation:glowPulse 3.8s ease-in-out infinite
}
.hero-island{
 position:absolute;width:205px;height:91px;left:50%;bottom:10px;transform:translateX(-50%);
 background:linear-gradient(165deg,#83c68c 0 40%,#458b72 41% 63%,#765c43 64% 100%);
 clip-path:polygon(0 20%,18% 0,35% 14%,52% 0,73% 13%,100% 7%,85% 53%,68% 74%,56% 100%,39% 76%,18% 63%);
 filter:drop-shadow(0 10px 6px rgba(8,28,40,.3))
}
.hero-mascot{
 position:absolute;left:50%;top:41px;transform:translateX(-50%) rotate(-4deg);

 display:grid;place-items:center;background:linear-gradient(145deg,#fff8d8,#ffc86a);

 box-shadow:0 8px 18px rgba(8,30,44,.22);border-radius:18px

.hero-map{width:60px;height:62px;left:2px;top:94px;background:#fff3c8;font-size:32px;transform:rotate(-12deg)}

.quest-step b{color:#ffdf83}

.tabletop-head h2{color:#1b4356}

.prompt-card{background:radial-gradient(circle at 100% 0,rgba(255,223,143,.2),transparent 11rem),linear-gradient(145deg,#fff8e5,#fffef9 65%);border:2px solid #ecd89c;border-radius:22px;box-shadow:0 9px 18px rgba(106,84,38,.09),inset 0 1px 0 #fff;animation:cardDeal .32s ease-out}
.prompt-card:after{content:"任務牌";position:absolute;right:16px;top:15px;background:#df7254;color:#fff;font-size:12px;font-weight:900;padding:6px 9px;border-radius:8px;transform:rotate(5deg);box-shadow:0 3px 0 #b9563e}

.blank{color:#ad5d2e;background:#fff0ce;border-radius:8px;padding:0 5px}
.secondary{background:linear-gradient(180deg,#f1f7ff,#e1effd);box-shadow:0 4px 0 #c6d8eb}
.soft{background:linear-gradient(180deg,#f8f7f2,#ebe9df);box-shadow:0 4px 0 #d8d4c6}
.choice-grid{gap:15px}
.choice{position:relative;overflow:hidden;min-height:105px;padding:22px 15px 16px;border:2px solid rgba(255,255,255,.98);border-bottom:6px solid #c5d2d8;border-radius:20px;background:linear-gradient(150deg,#fff,#f5fbff);color:#24475b;box-shadow:0 8px 13px rgba(34,74,89,.1);font-size:clamp(20px,3.2vw,26px);text-align:center}
.choice:nth-child(2){background:linear-gradient(150deg,#fff,#f1fbf5);border-bottom-color:#b5d8c2}
.choice:nth-child(3){background:linear-gradient(150deg,#fff,#fff7e9);border-bottom-color:#edd297}
.choice:before{content:"";position:absolute;left:-17px;bottom:-26px;width:70px;height:70px;border-radius:50%;background:rgba(97,163,179,.1)}
.choice:after{content:"✦";position:absolute;right:12px;top:8px;color:#d5a740;font-size:14px;opacity:.75}
.choice:hover{border-color:#b9d9c5;background:linear-gradient(150deg,#fff,#e8f7ee);transform:translateY(-3px) rotate(-.5deg)}
.feedback{box-shadow:0 5px 12px rgba(45,78,85,.06);border-radius:18px}
.feedback.good{background:linear-gradient(110deg,#e2f7e9,#f5fff5);border-color:#a9dcb9;color:#245b40}
.feedback.good:before{content:"✨ ";font-size:21px}
.feedback.try{background:linear-gradient(110deg,#fff5da,#fffaf0);border-color:#efd894;color:#6f561c;animation:gentleNudge .28s ease-out}
.usage-options{gap:15px}
.text-choice{position:relative;overflow:hidden;min-height:118px;border:2px solid #e4e8dc;border-bottom:6px solid #c7d8d0;border-radius:20px;background:linear-gradient(150deg,#fff,#f5fbf8);box-shadow:0 8px 14px rgba(34,74,89,.08);font-size:17px;color:#2a4b5b;padding:18px}
.text-choice:nth-child(2){background:linear-gradient(150deg,#fff,#fff8ed);border-bottom-color:#e9d4a1}
.text-choice:hover{border-color:#a8d3bd;background:linear-gradient(150deg,#fff,#eaf8ef);transform:translateY(-2px)}
.text-choice .letter{width:34px;height:34px;background:#2b7293;color:#fff;box-shadow:0 3px 0 #1b536d;vertical-align:middle}
.idiom-display{background:linear-gradient(110deg,#e4f5ed,#eaf3ff);border:1px solid #c9e5d7;box-shadow:inset 0 1px 0 #fff}
.idiom-seal{background:linear-gradient(145deg,#fff5c7,#ffd56d);box-shadow:0 5px 0 #dfb04d,0 9px 15px rgba(104,86,38,.15);transform:rotate(-5deg)}
.idiom-display h3{color:#1b4c60}
.self-card{background:linear-gradient(145deg,#fff,#fbf8ef);border:2px solid #eee2c3;box-shadow:0 7px 14px rgba(76,70,48,.06)}
.self-card h3{color:#a75e2d}
.example-box{background:#fff5d7;border-left-color:#efa93d;box-shadow:inset 0 0 0 1px #f2dda3}
.summary{position:relative;overflow:hidden;background:radial-gradient(circle at 50% -40%,rgba(255,212,107,.45),transparent 17rem),linear-gradient(145deg,#fffef9,#f1faf1)}
.summary-badge{background:linear-gradient(145deg,#fff2b8,#ffcf63);border:5px solid #fff;box-shadow:0 8px 0 #d9a143,0 14px 22px rgba(95,76,35,.16);animation:floatMascot 2.6s ease-in-out infinite}
.summary h2{color:#1c5263}
.stat{background:rgba(255,255,255,.8);border:1px solid #dcebe1;box-shadow:0 5px 12px rgba(40,83,82,.06)}
.stat strong{color:#287552}
.review-chip{background:#fff0e8;border:1px solid #f0c9b8;color:#a24e3e}
.footer-note{color:#607985;font-weight:650}
.home-actions .progress-pill{font-size:15px}
@keyframes cardDeal{from{opacity:0;transform:translateY(12px) rotate(-1deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes floatMascot{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes glowPulse{0%,100%{scale:.94;opacity:.72}50%{scale:1.08;opacity:1}}
@keyframes twinkle{from{opacity:.45;transform:scale(.8) rotate(-10deg)}to{opacity:1;transform:scale(1.14) rotate(12deg)}}
@keyframes gentleNudge{0%{transform:translateX(0)}30%{transform:translateX(-3px)}65%{transform:translateX(3px)}100%{transform:translateX(0)}}
@media(max-width:760px){
 .hero-copy{max-width:73%}
 .hero-art{width:28%;right:1%;transform:scale(.87);transform-origin:right center}
 .home-hero{min-height:270px}
 .lesson-grid,.mode-grid{gap:11px}
 .lesson-card{min-height:137px}
 .choice-grid{grid-template-columns:1fr}
 .choice{min-height:76px}
}
@media(max-width:560px){
 .hero-copy{max-width:100%}
 .hero-art{position:relative;right:auto;top:auto;margin:5px auto -12px;width:240px;height:155px;transform:none}
 .hero-island{width:170px;height:70px}
 .hero-mascot{width:78px;height:78px;top:23px;border-radius:27px;font-size:46px}
 .hero-map{width:48px;height:49px;top:60px;font-size:25px}
 .hero-gem{width:47px;height:47px;top:48px;font-size:26px}
 .home-hero{padding:23px 19px 19px}
 .home-hero:after{font-size:16px;letter-spacing:7px}
 .quest-strip{gap:6px}
 .quest-step{font-size:11px;padding:6px 8px}
 .game-meta{width:100%}
 .game-top{gap:9px}
 .tabletop-head{flex-direction:row}
 .tabletop-head h2{font-size:20px}
 .stat-grid{gap:7px}
 .stat{padding:12px 6px}
 .stat strong{font-size:22px}
}
@media(max-width:430px){
 .topbar{align-items:center}
 .quiet-chip{max-width:118px;white-space:normal;text-align:center;line-height:1.35}
 .brand{gap:8px}
 .brand-mark{width:43px;height:43px;font-size:25px}
 h1{font-size:20px}
 .tagline{max-width:190px}
 .lesson-grid,.mode-grid{grid-template-columns:1fr}
 .lesson-card{min-height:125px}
 .usage-options{grid-template-columns:1fr}
 .tabletop-head{align-items:flex-start;flex-direction:column;gap:8px}
 .progress-pill{font-size:12px;padding:8px 10px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
.quest-trail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 16px}
.trail-step{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:#f0f3ef;border:1px solid #e1e7df;color:#71808a;font-size:13px;font-weight:900}
.trail-step b{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#dce5e2;color:#526d72}
.trail-step.active{background:linear-gradient(110deg,#286c81,#32856e);border-color:#286c81;color:#fff;box-shadow:0 4px 9px rgba(40,108,129,.2)}
.trail-step.active b{background:#ffdd7f;color:#553e17}
.trail-step.complete{background:#e5f5ea;border-color:#c6e6cf;color:#31704d}
.trail-step.complete b{background:#55a777;color:#fff}
.reward-banner{
 display:flex;align-items:center;gap:9px;margin:0 0 15px;padding:12px 15px;
 border-radius:15px;background:linear-gradient(100deg,#fff0b9,#fff8df);
 border:1px solid #f0d47e;color:#72511b;font-weight:900;
 box-shadow:0 5px 11px rgba(133,104,36,.1);animation:rewardPop .32s cubic-bezier(.2,1.4,.4,1)
}
.reward-banner .reward-icon{font-size:23px;filter:drop-shadow(0 2px 1px rgba(133,104,36,.18))}
.found-card-label{font-size:12px;font-weight:900;color:#428265;letter-spacing:.08em;margin-bottom:3px}
@keyframes rewardPop{from{opacity:0;transform:scale(.96) translateY(5px)}to{opacity:1;transform:scale(1) translateY(0)}}
</style>
</head>

const app = document.getElementById("app");
const STORE_KEY = "idiomCardTable.progress.v1";
const SESSION_KEY = "idiomCardTable.session.v1";
const lessonInfo = [
 {n:1,icon:"🧭",title:"第一課",desc:"等不及、忍住委屈與生活中的表達"},
 {n:2,icon:"🌨️",title:"第二課",desc:"做事步驟、努力態度和自然景象"},
 {n:3,icon:"🏡",title:"第三課",desc:"生活、待人與事情變化"},
 {n:4,icon:"🏅",title:"第四課",desc:"面對困難、掌握分寸與理解程度"},
 {n:5,icon:"🪄",title:"第五課",desc:"說話、情感與故事中的做法"},
 {n:6,icon:"🎨",title:"第六課",desc:"守規則、看情況與展現本領"}
];
let persistent = readJSON(STORE_KEY,{mastered:[],review:[]});
let game = readJSON(SESSION_KEY,null);
let showHintNow = false;
let showExampleNow = false;
let usageRetry = false;

function readJSON(key,fallback){try{const value=localStorage.getItem(key);return value?JSON.parse(value):fallback}catch(e){return fallback}}
function saveProgress(){try{localStorage.setItem(STORE_KEY,JSON.stringify(persistent))}catch(e){}}
function saveSession(){try{if(game){localStorage.setItem(SESSION_KEY,JSON.stringify(game))}else{localStorage.removeItem(SESSION_KEY)}}catch(e){}}
function byId(id){return cards.find(function(c){return c.id===id})}
function shuffle(list){const copy=list.slice();for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=copy[i];copy[i]=copy[j];copy[j]=t}return copy}
function unique(list){return Array.from(new Set(list))}
function htmlSafe(value){return String(value).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]})}
function progressCount(ids){return ids.filter(function(id){return persistent.mastered.indexOf(id)>=0}).length}

function renderHome(){
  const resumeButton=game?'<button class="primary" onclick="resumeGame()">▶ 繼續上次的牌局</button>':'';
  const lessons=lessonInfo.map(function(info){
    const lessonCards=cards.filter(function(c){return c.lesson===info.n});
    const pct=Math.round(progressCount(lessonCards.map(function(c){return c.id}))/lessonCards.length*100);
    return '<button class="lesson-card" data-lesson="'+info.n+'" onclick="startLesson('+info.n+')"><div class="lesson-head"><span class="lesson-name">'+info.title+'探險島</span><span class="lesson-icon" aria-hidden="true">'+info.icon+'</span></div><div class="lesson-desc">'+lessonCards.length+' 張成語牌・'+info.desc+'</div><div class="mini-progress" aria-label="已熟悉 '+pct+'%"><i style="width:'+pct+'%"></i></div></button>'
  }).join("");
  const reviewButton=persistent.review.length?'<button class="mode-card" onclick="startReview()"><div class="mode-icon">🔁</div><strong>重練需要想一想的牌</strong><span>目前有 '+persistent.review.length+' 張，答錯或用過提示的牌會再出現。</span></button>':'<div class="mode-card" aria-label="錯題重練"><div class="mode-icon">🔁</div><strong>錯題重練牌堆</strong><span>還沒有待重練的牌。答錯或用過提示的成語會放進這一堆。</span></div>';
  app.innerHTML =
   '<section class="panel home-hero fade-in"><div class="hero-copy"><div class="eyebrow">🗺️ 小小探險家任務</div><h2>出發！找到情境裡的成語寶藏</h2><p>每完成一張任務牌，就點亮一顆成語寶石。探訪六座課文小島，讓成語從課本走進你的生活！</p><div class="home-actions">'+resumeButton+'<span class="progress-pill">💎 已點亮 '+persistent.mastered.length+' / '+cards.length+' 顆寶石</span></div><div class="quest-strip"><span class="quest-step"><b>1</b> 發現情境</span><span class="quest-step"><b>2</b> 挑對用法</span><span class="quest-step"><b>3</b> 開口造句</span></div></div><div class="hero-art" aria-hidden="true"><div class="hero-glow"></div><div class="hero-island"></div><span class="hero-spark one">✦</span><span class="hero-spark two">✧</span><span class="hero-spark three">✦</span><div class="hero-map">🗺️</div><div class="hero-gem">💎</div><div class="hero-mascot">🦊</div></div></section>'+
   '<div class="section-title"><h3>🏝️ 選一座課文小島</h3><span>每島有 5–6 張成語寶藏</span></div><section class="lesson-grid">'+lessons+'</section>'+
   '<div class="section-title"><h3>🎒 探險背包</h3><span>挑選適合今天的任務</span></div><section class="mode-grid">'+
    '<button class="mode-card" onclick="startMixed(12)"><div class="mode-icon">🎴</div><strong>隨機探險・12 張</strong><span>六課抽牌混合挑戰，短短一輪也能收集寶石。</span></button>'+
    '<button class="mode-card" onclick="startMixed(34)"><div class="mode-icon">🗝️</div><strong>完整尋寶・34 張</strong><span>走遍六座小島，把全部成語寶藏都找出來。</span></button>'+
    reviewButton+
   '</section><p class="note">✨ 每張任務牌有兩顆星星：情境配對、用法挑戰。答錯不扣分；提示牌稍後會再出現。六課近義詞不會被放在容易混淆的同題選項裡。</p>';
}

function startLesson(n){startGame("lesson",cards.filter(function(c){return c.lesson===n}).map(function(c){return c.id}),"第"+n+"課")}
function startMixed(count){startGame(count===34?"all":"mixed",shuffle(cards.map(function(c){return c.id})).slice(0,count),count===34?"全套 34 張":"六課混合 12 張")}
function startReview(){const ids=persistent.review.map(function(id){return id}).filter(function(id){return !!byId(id)});if(!ids.length){renderHome();return}startGame("review",shuffle(ids),"錯題重練")}
function startGame(mode,ids,title){
 game={mode:mode,ids:ids.slice(),title:title,index:0,phase:"scene",score:0,correctScenes:0,correctUsage:0,attempts:0,usedHint:false,cardMistake:false,sceneOptions:[],usageAttempts:0,usageOptions:[],usageFeedback:"",usageWrongAnswer:false};
 showHintNow=false;showExampleNow=false;usageRetry=false;saveSession();renderGame()
}
function resumeGame(){renderGame()}
function current(){return game&&game.ids[game.index]?byId(game.ids[game.index]):null}
function returnHome(){saveSession();renderHome()}
function currentProgress(){return game?Math.min(game.index+(game.phase==="summary"?0:1),game.ids.length):0}
function renderQuestTrail(active){
 const labels=["發現情境","挑對用法","開口造句"];
 return '<div class="quest-trail" aria-label="本張任務進度">'+labels.map(function(label,index){const step=index+1;const cls=step<active?"complete":(step===active?"active":"");return '<span class="trail-step '+cls+'"><b>'+step+'</b>'+label+'</span>'}).join("")+'</div>'
}

function renderGame(){
 if(!game){renderHome();return}
 if(game.index>=game.ids.length){renderSummary();return}
 const c=current();if(!c){game.index++;saveSession();renderGame();return}
 const progress=currentProgress(),total=game.ids.length,pct=Math.round(progress/total*100);
 const meta='<div class="game-top"><div class="game-meta"><span class="progress-pill">🎴 '+htmlSafe(game.title)+'</span><span class="progress-pill">⭐ '+game.score+' 星</span></div><button class="soft" onclick="returnHome()">↩ 回牌桌</button></div>'+
 '<section class="panel progress-wrap"><div class="progress-label"><span>第 '+progress+' 張 / 共 '+total+' 張</span><span>'+pct+'%</span></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div></section>';
 let inner="";
 if(game.phase==="scene"){inner=renderScene(c)}
 else if(game.phase==="usage"){inner=renderUsage(c)}
 else if(game.phase==="self"){inner=renderSelf(c)}
 else if(game.phase==="sceneFeedback"){inner=renderScene(c)}
 app.innerHTML=meta+inner;
}

function renderScene(c){
 if(!game.sceneOptions||!game.sceneOptions.length){game.sceneOptions=shuffle([c.id].concat(c.distractors));saveSession()}
 const options=game.sceneOptions.map(function(id){const option=byId(id);return '<button class="choice" onclick="answerScene(\''+option.id+'\')">'+htmlSafe(option.idiom)+'</button>'}).join("");
 const hint=game.usedHint?'<div class="hint-box"><strong>小提示：</strong>'+htmlSafe(c.meaning)+' 想一想，哪張成語牌和這個意思最接近？</div>':'';
 const feedback=game.sceneFeedback?'<div class="feedback try" role="status"><strong>再讀一次情境～</strong><br>'+htmlSafe(game.sceneFeedback)+(game.attempts>=1?'<br><strong>小提示：</strong>'+htmlSafe(c.meaning):'')+'<div class="feedback-actions"><button class="secondary" onclick="clearSceneFeedback()">我再選一次</button><button class="soft" onclick="showSceneHint()">看小提示</button></div></div>':'';
 return '<section class="panel tabletop fade-in"><div class="tabletop-head"><h2>🧭 找出最合適的成語牌</h2><span class="step-label">寶藏任務 1 / 3</span></div>'+renderQuestTrail(1)+'<div class="prompt-card"><div class="card-label">📜 情境任務牌</div><div class="prompt-text">'+htmlSafe(c.scene.replace("＿＿","<答案>")).replace("&lt;答案&gt;",'<span class="blank">＿＿</span>')+'</div><div class="hint-row">'+(hint||'')+(!game.usedHint?'<button class="secondary" onclick="showSceneHint()">💡 給我一點提示</button>':'')+'</div></div>'+feedback+'<div class="choice-grid" aria-label="成語牌選項">'+options+'</div></section>'
}
function clearSceneFeedback(){game.sceneFeedback="";game.phase="scene";saveSession();renderGame()}
function showSceneHint(){game.usedHint=true;game.cardMistake=true;game.sceneFeedback="已翻開小提示。先讀懂意思，再挑一張成語牌。";saveSession();renderGame()}
function answerScene(id){
 const c=current();if(!c)return;
 if(id===c.id){game.phase="usage";game.sceneFeedback="";game.attempts=0;game.correctScenes++;if(!game.cardMistake)game.score++;game.rewardMessage="情境配對成功！再挑一句合適的用法，就能點亮第二顆星。";game.usageOptions=shuffle([{text:c.example,correct:true},{text:c.usageBad,correct:false}]);game.usageAttempts=0;game.usageFeedback="";game.usageWrongAnswer=false;saveSession();renderGame();return}
 game.attempts++;game.cardMistake=true;game.sceneFeedback="這張牌和情境還不太合。"+(game.attempts===1?"請再看看情境裡的線索。":"提示已翻開，找找意思最接近的牌。");if(game.attempts>=2)game.usedHint=true;saveSession();renderGame()
}

function renderUsage(c){
 const options=game.usageOptions.map(function(o,index){return '<button class="text-choice" onclick="answerUsage('+index+')"><span class="letter">'+String.fromCharCode(65+index)+'</span>'+htmlSafe(o.text)+'</button>'}).join("");
 const feedback=game.usageFeedback?'<div class="feedback '+(game.usageWrongAnswer?"try":"good")+'" role="status"><strong>'+(game.usageWrongAnswer?"再想一想":"選得很好！")+'</strong><br>'+htmlSafe(game.usageFeedback)+(game.usageWrongAnswer?'<div class="feedback-actions"><button class="secondary" onclick="retryUsage()">再選一次</button><button class="soft" onclick="revealUsage()">看正確用法</button></div>':'')+'</div>':'';
 return '<section class="panel tabletop fade-in"><div class="tabletop-head"><h2>🔎 幫成語挑一句合適的話</h2><span class="step-label">寶藏任務 2 / 3</span></div>'+renderQuestTrail(2)+'<div class="reward-banner"><span class="reward-icon">🌟</span><span>'+htmlSafe(game.rewardMessage||"情境配對成功！再找找看哪一句用得恰當。")+'</span></div><div class="idiom-display"><div class="idiom-seal">✍️</div><div><div class="found-card-label">你找到的成語寶藏</div><h3>'+htmlSafe(c.idiom)+'</h3><p>'+htmlSafe(c.meaning)+'</p></div></div><div class="usage-options">'+options+'</div>'+feedback+'</section>'
}
function answerUsage(index){
 const c=current(),option=game.usageOptions[index];if(!c||!option)return;
 if(option.correct){game.correctUsage++;if(!game.cardMistake)game.score++;game.phase="self";game.rewardMessage="用法也答對了！你已找到這張成語卡的兩顆星。";game.usageFeedback="";game.usageWrongAnswer=false;saveSession();renderGame();return}
 game.usageAttempts++;game.cardMistake=true;game.usageWrongAnswer=true;game.usageFeedback="這句話和「"+c.idiom+"」的意思不太合。你可以再選一次，也可以先看正確例句。";saveSession();renderGame()
}
function retryUsage(){game.usageFeedback="";game.usageWrongAnswer=false;saveSession();renderGame()}
function revealUsage(){const c=current();if(!c)return;game.phase="self";game.cardMistake=true;game.usageFeedback="";game.usageWrongAnswer=false;showExampleNow=true;saveSession();renderGame()}

function renderSelf(c){
 const example=showExampleNow?'<div class="example-box"><strong>例句：</strong>'+htmlSafe(c.example)+'</div>':'';
 const missed=game.cardMistake?'<div class="feedback try"><strong>這張牌已放進「再練習」牌堆。</strong><br>沒關係，下一次再遇到，就會更熟悉。</div>':'';
 return '<section class="panel tabletop fade-in"><div class="tabletop-head"><h2>🗣️ 把成語放進自己的話</h2><span class="step-label">寶藏任務 3 / 3</span></div>'+renderQuestTrail(3)+'<div class="reward-banner"><span class="reward-icon">🎉</span><span>'+htmlSafe(game.rewardMessage||"完成最後一步，就能把這張成語牌收進背包！")+'</span></div><div class="idiom-display"><div class="idiom-seal">💎</div><div><div class="found-card-label">即將收進背包的成語</div><h3>'+htmlSafe(c.idiom)+'</h3><p>'+htmlSafe(c.meaning)+'</p></div></div><div class="self-card"><h3>輪到你了！</h3><p>先大聲說一句自己的例句，不用打字。可以想想：在學校、家裡或和朋友玩時，什麼情況會用到這個成語？</p>'+example+'</div>'+missed+'<div class="button-row"><button class="primary" onclick="collectCard()">我想好了，收下這張牌</button>'+(!showExampleNow?'<button class="secondary" onclick="peekExample()">先看一個例句</button>':'')+'<button class="soft" onclick="skipSentence()">先收牌，之後再造句</button></div></section>'
}
function peekExample(){showExampleNow=true;saveSession();renderGame()}
function collectCard(){
 const c=current();if(!c)return;
 if(game.cardMistake){persistent.review=unique(persistent.review.concat([c.id]));persistent.mastered=persistent.mastered.filter(function(id){return id!==c.id})}
 else{persistent.mastered=unique(persistent.mastered.concat([c.id]));persistent.review=persistent.review.filter(function(id){return id!==c.id})}
 saveProgress();advanceCard()
}
function skipSentence(){const c=current();if(c){persistent.review=unique(persistent.review.concat([c.id]));persistent.mastered=persistent.mastered.filter(function(id){return id!==c.id});saveProgress()}advanceCard()}
function advanceCard(){game.index++;game.phase="scene";game.attempts=0;game.usedHint=false;game.cardMistake=false;game.sceneOptions=[];game.usageAttempts=0;game.usageOptions=[];game.usageFeedback="";game.usageWrongAnswer=false;game.rewardMessage="";showHintNow=false;showExampleNow=false;usageRetry=false;saveSession();renderGame()}

function renderSummary(){
 const total=game.ids.length;const reviewIds=unique(game.ids.filter(function(id){return persistent.review.indexOf(id)>=0}));
 const masteredNow=game.ids.filter(function(id){return persistent.mastered.indexOf(id)>=0}).length;
 const names=reviewIds.map(function(id){return '<span class="review-chip">'+htmlSafe(byId(id).idiom)+'</span>'}).join("");
 app.innerHTML='<section class="panel summary fade-in"><div class="summary-badge">🎉</div><div class="eyebrow">牌局完成</div><h2>你完成了這一桌！</h2><p>每一次想情境、挑用法、自己造句，都讓成語更靠近你的生活。可以休息一下，也可以把需要想一想的牌再玩一次。</p><div class="stat-grid"><div class="stat"><strong>'+total+'</strong><span>完成卡牌</span></div><div class="stat"><strong>'+game.score+'</strong><span>成語星星</span></div><div class="stat"><strong>'+masteredNow+'</strong><span>已收進熟悉牌堆</span></div></div>'+(reviewIds.length?'<div><strong>下次可以再練這些牌：</strong><div class="review-list">'+names+'</div></div>':'<div class="feedback good"><strong>太棒了！</strong>這一輪的牌都順利收進熟悉牌堆。</div>')+'<div class="button-row" style="justify-content:center">'+(reviewIds.length?'<button class="primary" onclick="startReview()">🔁 重練待熟悉的牌</button>':'')+'<button class="secondary" onclick="newRound()">再玩一輪</button><button class="soft" onclick="finishGame()">回到選課牌桌</button></div></section>';
}
function newRound(){const mode=game.mode;if(mode==="lesson"){const n=Number(game.ids[0].slice(1,2));startLesson(n)}else if(mode==="all"){startMixed(34)}else if(mode==="review"){startReview()}else{startMixed(12)}}
function finishGame(){game=null;saveSession();renderHome()}

renderHome();
</script>
</body>
</html>
