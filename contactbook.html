<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三日聯絡簿檢視板</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    /* 移除 body 的 overflow: hidden，讓整個頁面可以自然滾動 */
    body { margin: 0; padding: 0; background-color: #2b3a2f; }
    
    /* 自訂捲動條 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    
    .tate-chu-yoko { text-combine-upright: all; -webkit-text-combine: horizontal; display: inline-block; }
    .font-bopomofo { font-family: '王漢宗中楷體注音', '文鼎中楷注音', '全字庫注音體', 'BPMF', serif; }
    .font-zhuyin-only { font-family: '文鼎注音寬字', 'BPMF', serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    /* @jsxRuntime classic */
    /* @jsx React.createElement */
    /* @jsxFrag React.Fragment */

    const { useState, useEffect, useMemo } = React;

    // 您的雲端資料庫網址
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbyFCoOsxIX4sigNXacF8FpPpo4YfMWkJQNMUDo52wrHuYsj5b3oNdl9qbMKQdIeJi2h/exec";

    const Loader = ({ size = 24, className = "" }) => <svg className={`animate-spin ${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;
    const Calendar = ({ size = 16, className = "" }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;

    function ThreeDayViewer() {
      const [isLoaded, setIsLoaded] = useState(false);
      const [contactBookData, setContactBookData] = useState({});
      const [settings, setSettings] = useState({ cbDirection: 'horizontal', cbFont: 'sans', cbFontSize: 32, showListNumber: true });
      
      // 0 = 今天, 1 = 昨天, 2 = 前天
      const [activeIndex, setActiveIndex] = useState(0);

      // 計算三天的日期
      const dates = useMemo(() => {
        const getPastDate = (daysAgo) => {
          const d = new Date();
          d.setDate(d.getDate() - daysAgo);
          return d;
        };
        return [getPastDate(0), getPastDate(1), getPastDate(2)];
      }, []);

      const formatDateKey = (date) => {
        const d = new Date(date);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().split('T')[0];
      };

      const getWeekdayString = (date) => ['日', '一', '二', '三', '四', '五', '六'][date.getDay()];

      useEffect(() => {
        fetch(CLOUD_URL)
          .then(res => res.text())
          .then(text => {
            if (!text || text === "{}") return;
            try {
              const data = JSON.parse(text);
              if (data.settings) setSettings(data.settings);
              if (data.contactBookData) setContactBookData(data.contactBookData);
            } catch(e) { console.error("解析雲端資料失敗", e); }
          })
          .catch(err => console.error("無法連線至雲端", err))
          .finally(() => setIsLoaded(true));
      }, []);

      const getFontClass = () => {
        if (settings.cbFont === 'bopomofo') return "font-bopomofo";
        if (settings.cbFont === 'zhuyinOnly') return "font-zhuyin-only";
        return "font-sans";
      };

      const parseListContent = (text) => {
        if (!text) return [];
        return text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
      };

      const renderText = (text) => {
        const isVertical = settings.cbDirection === 'vertical';
        const isZhuyinOnly = settings.cbFont === 'zhuyinOnly';
        const isBopomofo = settings.cbFont === 'bopomofo';
        const regex = /([a-zA-Z]+[\.\-]?[0-9]+[\.\)]?|[a-zA-Z0-9]+[\.\)]?|[\-\/]|數)/;
        const testRegex = /^([a-zA-Z]+[\.\-]?[0-9]+[\.\)]?|[a-zA-Z0-9]+[\.\)]?|[\-\/])$/;
        
        const parts = text.split(regex);
        return parts.map((part, i) => {
          if (!part) return null;
          if (part === '數' && (isZhuyinOnly || isBopomofo)) {
            if (isZhuyinOnly) {
              return <span key={i} style={{ fontSize: '1.65em', lineHeight: '1', verticalAlign: 'middle', textAlign: 'center' }}>述</span>;
            } else if (isBopomofo && isVertical) {
              return (
                <span key={i} style={{ display: 'inline-block', position: 'relative', width: '1em', height: '1em', verticalAlign: 'middle', fontFamily: '"標楷體", "DFKai-SB", "BiauKai", serif' }}>
                  <span style={{ position: 'absolute', top: '50%', left: '28%', transform: 'translate(-50%, -50%)', fontSize: '0.95em', display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: '1', letterSpacing: 'normal' }}>數</span>
                  <div style={{ position: 'absolute', top: '50%', left: '98%', transform: 'translate(-50%, -50%)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', fontSize: '0.38em', lineHeight: '1.1', fontFamily: 'sans-serif', writingMode: 'horizontal-tb', letterSpacing: 'normal' }}>
                    <span style={{ marginBottom: '0.05em' }}>ㄕ</span>
                    <span style={{ position: 'relative', display: 'inline-block' }}>ㄨ<span style={{ position: 'absolute', top: '-0.15em', left: '100%', marginLeft: '0.05em', fontSize: '0.9em', fontWeight: 'bold', lineHeight: '1' }}>ˋ</span></span>
                  </div>
                </span>
              );
            } else if (isBopomofo) {
              return (
                <span key={i} style={{ display: 'inline-flex', alignItems: 'center', position: 'relative', verticalAlign: 'middle', fontFamily: '"標楷體", "DFKai-SB", "BiauKai", serif', marginRight: '0.1em' }}>
                  <span className="leading-none" style={{ letterSpacing: 'normal' }}>數</span> 
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', fontSize: '0.45em', lineHeight: '1.1', paddingLeft: '0.02em', fontFamily: 'sans-serif', writingMode: 'horizontal-tb', letterSpacing: 'normal' }}>
                    <span style={{ marginBottom: '0.05em' }}>ㄕ</span>
                    <span style={{ position: 'relative', display: 'inline-block' }}>ㄨ<span style={{ position: 'absolute', top: '-0.15em', left: '100%', marginLeft: '0.05em', fontSize: '0.9em', fontWeight: 'bold', lineHeight: '1' }}>ˋ</span></span>
                  </div>
                </span>
              );
            }
          } else if (testRegex.test(part) && part.length <= 6) {
            const isDash = part === '-';
            return (
              <span key={i} className={`${isVertical ? 'tate-chu-yoko' : ''} inline-block font-sans`} style={{ margin: (isBopomofo && !isVertical) ? '0 0.1em 0 0.2em' : '0 0.1em', fontWeight: isZhuyinOnly ? '900' : 'normal', verticalAlign: 'middle', fontSize: isZhuyinOnly ? '1.4em' : '1em', letterSpacing: 'normal', transform: (isVertical && isDash) ? 'rotate(90deg)' : 'none' }}>
                {part}
              </span>
            );
          }
          return <span key={i} style={isZhuyinOnly ? { fontSize: '1.65em', lineHeight: '1', verticalAlign: 'middle', textAlign: 'center' } : { verticalAlign: 'middle', lineHeight: '1.2' }}>{part}</span>;
        });
      };

      if (!isLoaded) {
        return (
          <div className="min-h-screen w-screen flex flex-col items-center justify-center text-white/70 bg-[#2b3a2f]">
            <Loader size={48} className="mb-4 text-[#ffd54f]" />
            <h2 className="text-xl font-bold tracking-widest">正在讀取聯絡簿資料...</h2>
          </div>
        );
      }

      const activeDate = dates[activeIndex];
      const activeKey = formatDateKey(activeDate);
      const activeItems = parseListContent(contactBookData[activeKey]);

      const getLabelText = (index) => {
        if (index === 0) return "☀️ 今天";
        if (index === 1) return "◀️ 昨天";
        return "⏪ 前天";
      };

      const getLabelStyle = (index) => {
        if (index === 0) return "bg-[#ffd54f] text-[#6b4423]";
        if (index === 1) return "bg-[#9ccc65] text-[#1b5e20]";
        return "bg-[#81d4fa] text-[#01579b]";
      };

      // 計算出基礎字體大小，並針對手機做稍微縮放
      const baseFontSize = window.innerWidth < 768 ? settings.cbFontSize * 0.8 : settings.cbFontSize;

      return (
        /* 使用 min-h-screen 取代 h-screen，允許整體頁面在內容過多時自然往下長 */
        <div className="min-h-screen w-full flex flex-col bg-slate-900 font-sans">
          
          {/* 上方固定導覽列 - 切換日期 */}
          <div className="sticky top-0 flex justify-center gap-2 md:gap-4 p-3 md:p-4 bg-[#1e2a22] border-b border-white/10 shadow-xl z-50">
            {dates.map((d, i) => {
              const isActive = activeIndex === i;
              return (
                <button
                  key={i}
                  onClick={() => setActiveIndex(i)}
                  className={`flex items-center gap-1.5 md:gap-2 px-3 md:px-6 py-2 md:py-2.5 rounded-full font-bold text-sm md:text-base transition-all duration-300 shadow-sm ${
                    isActive 
                      ? 'bg-[#ffd54f] text-[#4a3018] scale-105 shadow-[0_0_15px_rgba(255,213,79,0.4)] ring-2 ring-[#ffd54f]/50' 
                      : 'bg-black/40 text-white/70 hover:bg-white/10 hover:text-white'
                  }`}
                >
                  <span className="hidden md:inline"><Calendar size={16} /></span>
                  {getLabelText(i)} 
                  <span className="opacity-80 text-[10px] md:text-xs tracking-wider">({d.getMonth()+1}/{d.getDate()})</span>
                </button>
              );
            })}
          </div>

          {/* 黑板主體區塊 - 解除高度限制，讓它根據內容自動撐開 */}
          <div className="flex-1 p-2 md:p-6 w-full max-w-7xl mx-auto flex flex-col items-stretch justify-start">
            
            <div className="w-full bg-[#2b3a2f] border-[10px] md:border-[20px] border-[#7d5030] rounded-2xl md:rounded-3xl relative flex flex-col shadow-[0_10px_40px_-10px_rgba(0,0,0,0.8)] overflow-hidden min-h-[70vh]">
               
               {/* 黑板粉筆灰特效背景 */}
               <div className="absolute inset-0 opacity-20 pointer-events-none mix-blend-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white/30 to-transparent"></div>
               
               {/* 黑板標題區 */}
               <div className="p-4 md:p-8 pb-3 md:pb-4 shrink-0 z-10 flex flex-col gap-3">
                  <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-2">
                     <div className="flex items-center gap-3">
                        <div className={`px-4 py-1.5 rounded-full font-black text-sm tracking-wide shadow-sm border border-black/10 w-fit ${getLabelStyle(activeIndex)}`}>
                           {getLabelText(activeIndex)}的聯絡簿
                        </div>
                     </div>
                     {/* 修復了星期顯示的問題，給予足夠的寬度不換行 */}
                     <div className="text-[#ffd54f] font-black text-xl md:text-3xl drop-shadow-md tracking-wide whitespace-nowrap">
                        {activeDate.getMonth() + 1} 月 {activeDate.getDate()} 日 (星期{getWeekdayString(activeDate)})
                     </div>
                  </div>
                  <div className="border-b-[3px] border-solid rounded-full border-white/20 mt-2"></div>
               </div>

               {/* 聯絡簿內容顯示區 - 移除 overflow，讓他完全展示 */}
               <div className={`p-4 md:p-8 z-10 relative flex-1 flex ${settings.cbDirection === 'vertical' ? 'flex-row-reverse justify-start' : 'flex-col'}`}>
                  
                  <div 
                    className={`text-[#f8f9fa] w-full min-h-full ${getFontClass()} pb-16 md:pb-20`}
                    style={{ 
                      fontSize: `${baseFontSize}px`, 
                      writingMode: settings.cbDirection === 'vertical' ? 'vertical-rl' : 'horizontal-tb',
                      lineHeight: (settings.cbDirection === 'vertical' && settings.cbFont === 'bopomofo') ? 2.5 : 1.8,
                      textShadow: '1px 1px 2px rgba(0,0,0,0.5)',
                      // 橫式排列時，使用 Flex 換行或是 Grid 來避免擠成一坨
                      display: settings.cbDirection === 'horizontal' ? 'flex' : 'block',
                      flexDirection: 'column',
                      gap: settings.cbDirection === 'horizontal' ? '1.5rem' : '0'
                    }}
                  >
                    {activeItems.map((item, index) => (
                      <div key={index} className={`flex break-inside-avoid ${settings.cbDirection === 'vertical' ? 'items-center ml-8 md:ml-12 mb-0' : 'items-start gap-3 w-full'}`}>
                        {settings.showListNumber && (
                          <div className="shrink-0 rounded-full bg-[#ffd54f] text-[#2b3a2f] flex items-center justify-center font-black shadow-sm font-sans"
                            style={{ 
                               width: `${baseFontSize * 1.2}px`, 
                               height: `${baseFontSize * 1.2}px`, 
                               fontSize: `${baseFontSize * 0.7}px`, 
                               marginTop: settings.cbDirection === 'horizontal' ? '0.2em' : '0', 
                               marginBottom: settings.cbDirection === 'vertical' ? '0.5em' : '0', 
                               writingMode: 'horizontal-tb', 
                               letterSpacing: 'normal' 
                            }}>
                            {index + 1}
                          </div>
                        )}
                        <div className="leading-snug" style={{ letterSpacing: settings.cbFont === 'bopomofo' ? '0.1em' : '0.05em' }}>
                           {renderText(item)}
                        </div>
                      </div>
                    ))}
                    
                    {activeItems.length === 0 && (
                      <div className="text-white/40 italic font-bold tracking-widest pt-10 text-center w-full" style={{ fontSize: `${baseFontSize * 0.8}px`, writingMode: 'horizontal-tb' }}>
                         這一天沒有發布聯絡簿內容喔！
                      </div>
                    )}
                  </div>

               </div>

               {/* 粉筆槽裝飾 - 固定在黑板最底部 */}
               <div className="absolute bottom-0 left-0 right-0 h-6 md:h-8 bg-[#4a3018] border-t-[3px] border-[#3a2010] flex items-end px-8 md:px-16 pb-1 md:pb-1.5 gap-4 md:gap-8 z-20 shadow-[inset_0_4px_6px_rgba(0,0,0,0.4)] pointer-events-none">
                   <div className="w-10 md:w-16 h-2 bg-white rounded-full shadow-sm opacity-90 rotate-1"></div>
                   <div className="w-6 md:w-10 h-2 bg-pink-300 rounded-full shadow-sm opacity-90 -rotate-2"></div>
                   <div className="w-8 md:w-12 h-2 bg-sky-300 rounded-full shadow-sm opacity-90 rotate-1"></div>
               </div>
               
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ThreeDayViewer />);
  </script>
</body>
</html>
