<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四年級健體小達人闖關遊戲</title>
    <style>
        /* ================= 基礎設定 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', '微軟正黑體', 'Arial', sans-serif;
        }

        body {
            /* 健體專屬：活潑的天空藍漸層背景 */
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        /* ================= 動畫效果 ================= */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-bounce { animation: bounce 2s infinite ease-in-out; }
        .animate-pulse { animation: pulse 1.5s infinite; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* ================= 畫面容器 ================= */
        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }
        .screen-large {
            max-width: 800px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            border: 6px solid #ffffff;
            position: relative;
            text-align: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background-color: #fef08a;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.6;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -20px;
            width: 80px;
            height: 80px;
            background-color: #bfdbfe;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.6;
        }
        .card-content {
            position: relative;
            z-index: 10;
        }

        /* ================= 元件樣式 ================= */
        h1 {
            color: #2563eb;
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #bfdbfe;
        }

        p.subtitle {
            color: #64748b;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .input-box {
            width: 100%;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border: 4px solid #e2e8f0;
            border-radius: 20px;
            background-color: #f8fafc;
            color: #334155;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .input-box:focus {
            border-color: #60a5fa;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.2);
        }

        .error-msg {
            color: #ef4444;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            display: none;
        }

        /* --- 立體按鈕 --- */
        .btn-3d {
            width: 100%;
            padding: 18px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            position: relative;
            top: 0;
        }
        .btn-3d:active {
            top: 6px;
            border-bottom-width: 0 !important;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
            border-bottom: 8px solid #1d4ed8;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
        }
        .btn-primary:hover { background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 100%); }

        .btn-secondary {
            background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
            border-bottom: 8px solid #a16207;
            color: #713f12;
            box-shadow: 0 10px 15px -3px rgba(234, 179, 8, 0.4);
        }
        .btn-secondary:hover { background: linear-gradient(180deg, #fef08a 0%, #facc15 100%); }

        .btn-ghost {
            background: #ffffff;
            border-bottom: 6px solid #cbd5e1;
            color: #475569;
            border-top: 2px solid #e2e8f0;
            border-left: 2px solid #e2e8f0;
            border-right: 2px solid #e2e8f0;
            margin-top: 15px;
        }
        .btn-ghost:hover { background: #f8fafc; color: #334155; }

        /* ================= 遊戲區塊專屬 ================= */
        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
        }
        .badge {
            background-color: white;
            padding: 10px 20px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 3px solid;
        }
        .badge-blue { border-color: #bfdbfe; color: #2563eb; }
        .badge-yellow { border-color: #fef08a; color: #ca8a04; display: flex; align-items: center; gap: 8px; }

        .question-box {
            background-color: white;
            border: 4px solid #bfdbfe;
            border-radius: 24px;
            padding: 30px;
            min-height: 220px;
            margin-bottom: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .q-type-tag {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 18px;
            margin-bottom: 15px;
            transform: rotate(-2deg);
            box-shadow: 2px 2px 0px #1d4ed8;
        }
        .question-text {
            font-size: 26px;
            font-weight: bold;
            color: #1e293b;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            width: 100%;
        }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .btn-tf-o {
            background: #4ade80;
            border-bottom: 12px solid #16a34a;
            color: white;
            font-size: 80px;
            border-radius: 30px;
            padding: 20px 0;
            text-shadow: 0 4px 0 #16a34a;
        }
        .btn-tf-o:active { border-bottom-width: 0 !important; top: 12px; margin-bottom: 12px; }
        
        .btn-tf-x {
            background: #f87171;
            border-bottom: 12px solid #dc2626;
            color: white;
            font-size: 80px;
            border-radius: 30px;
            padding: 20px 0;
            text-shadow: 0 4px 0 #dc2626;
        }
        .btn-tf-x:active { border-bottom-width: 0 !important; top: 12px; margin-bottom: 12px; }

        .btn-mc {
            background: white;
            border: 3px solid #e2e8f0;
            border-bottom: 8px solid #cbd5e1;
            color: #334155;
            font-size: 22px;
            font-weight: bold;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-start;
        }
        .btn-mc:hover { border-color: #93c5fd; background: #f0f9ff; }
        .mc-num {
            background-color: #dbeafe;
            color: #2563eb;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            flex-shrink: 0;
        }

        /* 回饋遮罩 */
        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .feedback-overlay.show { opacity: 1; }
        .feedback-correct { background-color: rgba(74, 222, 128, 0.95); }
        .feedback-wrong { background-color: rgba(248, 113, 113, 0.95); }
        .feedback-icon { font-size: 100px; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
        .feedback-text { font-size: 40px; font-weight: 900; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* ================= 結算與排行榜 ================= */
        .score-box {
            background: #f0fdf4;
            border: 4px solid #bbf7d0;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 20px;
            transform: rotate(1deg);
        }
        .score-box h3 { color: #64748b; font-size: 24px; margin-bottom: 10px; }
        .score-num { color: #22c55e; font-size: 80px; font-weight: 900; line-height: 1; text-shadow: 3px 3px 0 #bbf7d0; }
        
        .time-box {
            background: #fffbeb;
            border: 4px solid #fef08a;
            border-radius: 16px;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #ca8a04;
            margin-bottom: 30px;
            transform: rotate(-1deg);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #e9d5ff;
        }
        .leaderboard-table th {
            background-color: #f3e8ff;
            color: #7e22ce;
            padding: 15px;
            font-size: 20px;
        }
        .leaderboard-table td {
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #475569;
            border-bottom: 1px solid #f1f5f9;
        }
        .leaderboard-table tr:nth-child(even) { background-color: #f8fafc; }
        .leaderboard-table tr:nth-child(odd) { background-color: #ffffff; }
    </style>
</head>
<body>

    <div id="screen-login" class="screen active fade-in">
        <div class="card">
            <div class="card-content">
                <div class="animate-bounce" style="font-size: 90px; margin-bottom: -10px; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.15));">🏆</div>
                <h1>健體小達人</h1>
                <p class="subtitle">總共 50 題，準備好拿 100 分了嗎？</p>
                
                <input type="text" id="seat-input" class="input-box" placeholder="👉 請輸入你的座號">
                <div id="login-error" class="error-msg">哎呀！請先輸入座號才能開始喔！</div>
                
                <button class="btn-3d btn-primary" onclick="startGame()">
                    <span style="font-size: 28px;">▶️</span> 開始挑戰！
                </button>
            </div>
        </div>
        
        <button id="btn-show-leaderboard" class="btn-3d btn-ghost" style="max-width: 300px; margin-top: 20px;" onclick="showScreen('screen-leaderboard')">
            <span>🏅</span> <span id="btn-lb-text">查看全班連線榜</span>
        </button>
    </div>

    <div id="screen-playing" class="screen screen-large fade-in">
        <div class="top-bar">
            <div class="badge badge-blue" id="question-counter">第 1 / 50 題</div>
            <div class="badge badge-yellow">
                <span class="animate-pulse">⏱️</span> 
                <span id="timer-display">0分 0秒</span>
            </div>
        </div>

        <div class="question-box" id="question-box">
            <div id="feedback-overlay" class="feedback-overlay">
                <div class="feedback-icon" id="feedback-icon"></div>
                <div class="feedback-text" id="feedback-text"></div>
            </div>

            <div class="q-type-tag" id="question-type-tag">題型</div>
            <div class="question-text" id="question-text">題目載入中...</div>
        </div>

        <div id="options-container" class="options-grid">
            </div>
    </div>

    <div id="screen-result" class="screen fade-in">
        <div class="card" style="border-color: #86efac;">
            <div class="card-content">
                <h2 style="color: #16a34a; font-size: 40px; font-weight: 900; margin-bottom: 20px;">挑戰完成！</h2>
                
                <div class="score-box">
                    <h3>你的總分</h3>
                    <div class="score-num"><span id="final-score">100</span><span style="font-size: 30px;">分</span></div>
                </div>

                <div class="time-box">
                    ⏱️ 花費時間：<span id="final-time"></span>
                </div>

                <button class="btn-3d btn-secondary" style="margin-bottom: 15px;" onclick="showScreen('screen-leaderboard')">
                    <span style="font-size: 28px;">🏅</span> 全班連線英雄榜
                </button>
                <button class="btn-3d btn-ghost" onclick="showScreen('screen-login')">
                    <span style="font-size: 28px;">🔄</span> 回首頁換人玩
                </button>
            </div>
        </div>
    </div>

    <div id="screen-leaderboard" class="screen screen-large fade-in">
        <div class="card" style="border-color: #d8b4fe;">
            <div class="card-content">
                <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 25px;">
                    <span style="font-size: 40px;">🏆</span>
                    <h2 style="color: #7e22ce; font-size: 32px; font-weight: 900;">全班連線英雄榜</h2>
                    <span style="font-size: 40px;">🏆</span>
                </div>

                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>名次</th>
                            <th>座號</th>
                            <th>分數</th>
                            <th>時間</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="4" style="text-align: center; padding: 30px; color: #94a3b8;">資料連線中...</td></tr>
                    </tbody>
                </table>

                <button class="btn-3d btn-primary" style="background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%); border-color: #581c87;" onclick="showScreen('screen-login')">
                    <span style="font-size: 28px;">🔄</span> 回首頁挑戰
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 健體題庫 (已修正：包含複習卷B 所有選擇題)
        const tfQuestionsDB = [
            { q: "能肯定自己的人，不會因為自己的缺點而自卑，反而會積極改變缺點。", a: 0 },
            { q: "長腋毛、長陰毛是男性與女性都有的第二性徵。", a: 0 },
            { q: "家人是與我們最親近的人，因此不必跟家人溝通也能維持良好關係。", a: 1 },
            { q: "有嬰兒的家庭，緊急避難包中應另準備奶粉、奶瓶、紙尿布。", a: 0 },
            { q: "進入青春期，生殖器官成熟後，女性開始有夢遺，男生則可能會有月經。", a: 1 },
            { q: "跟同學打招呼時，為了顯示兩人交情好，可以隨意碰觸對方的身體。", a: 1 },
            { q: "扭傷的處理原則為沖、脫、泡、蓋、送。", a: 1 },
            { q: "地震發生時，應牢記並執行「趴下、掩護、逃生」三步驟。", a: 1 },
            { q: "「接觸傳染」是指若接觸病患碰過的物品，再摸自己的眼、口、鼻，就可能被傳染。", a: 0 },
            { q: "急救箱應放在太陽晒得到的地方，避免細菌孳生。", a: 1 },
            { q: "女性進入青春期後，卵巢每個月會排放一顆卵子，如果卵子沒有受精、著床，則因排卵增厚的子宮內膜會剝落形成月經。", a: 0 },
            { q: "男生一定都比較勇敢、大膽，女生則一定比較溫柔、細心。", a: 1 },

            { q: "如果傷口處理後的分泌物變多，發出臭味，將傷口擦拭後換新的紗布就好，不必進一步處理。", a: 1 },
            { q: "「直接加壓止血」是指止血的時候，用紗布或乾淨的衣服、毛巾鋪在傷口上，直接按壓流血的傷口處。", a: 0 },
            { q: "放颱風假時，是難得可以跟家人相處的機會，一定要全家一起出門旅遊。", a: 1 },
            { q: "對花粉過敏的人，花季時應下雨後再外出，並記得戴口罩。", a: 0 },
            { q: "夢遺是指男性熟睡時，身體將精液排出體外的生理現象。", a: 0 },
            { q: "男性發生夢遺後，應換上乾淨的內褲，並把換下的內褲洗乾淨。", a: 0 },
            { q: "為了跟同學有多一些時間相聚，就算半夜再回家也沒關係。", a: 1 },
            { q: "飲用水、現金、禦寒衣物、輕便雨衣等都是緊急避難包的必備物品。", a: 0 },
            { q: "地震後如果停電，最好點蠟燭照明。", a: 1 },
            { q: "地震後外出避難時，為了把握時間，可以不穿鞋子逃生。", a: 1 },
            { q: "每兩年要定期檢查緊急避難包，確認物品無損壞或過期。", a: 1 },
            { q: "晚上回家時，應走在人少的地方，以杜絕不安全的狀況發生。", a: 1 },
            { q: "重量重的背包可以裝比較多物品，適合用來當緊急避難包。", a: 1 },
            { q: "出門前，應告訴家人跟誰出門、去哪裡，以及回家的時間。", a: 0 },
            { q: "每個人青春期開始的時間不同，通常男生比女生早進入青春期。", a: 1 },
            { q: "一般人進入青春期後，在生理上和心理上會有所成長與發展。", a: 0 },
            { q: "進入青春期後產生的生理變化稱為「第二性徵」。", a: 0 },
            { q: "長鬍鬚、喉結突出、變聲、肩膀變寬都是男性的第二性徵。", a: 0 },
            { q: "輸卵管是將卵子輸送到子宮的管道。", a: 0 },
            { q: "如果在學校來月經，可以向老師或護理師尋求協助。", a: 0 },

            { q: "月經的週期每個人相同，固定為一個月。", a: 1 }
        ];

        const mcQuestionsDB = [
            { q: "地震後如果受困在建築物中，應該怎麼做？", opts: ["驚慌大喊", "運用身邊物品求援，例如：石頭", "試圖把體力都用來搬移阻擋出路的石塊"], a: 1 },

            { q: "下列關於「呼吸系統」的敘述何者正確？", opts: ["肺：是人體與外界進行氣體交換的地方", "咽：負責輸送空氣，也是發聲的重要器官", "氣管和支氣管：負責輸送空氣和食物"], a: 0 },

            { q: "颱風過後仍不能掉以輕心，以下哪一種行為適當？", opts: ["生飲自來水", "發現路樹倒塌時撥打119通報", "發現電線斷落時用手搬移電線", "走路強行通過淹水地區"], a: 1 },
            { q: "肺炎嚴重影響人們日常生活，下列何者是預防肺炎的防疫行為？", opts: ["午餐時間，與同學邊吃飯邊聊天", "只用自己的牙刷和毛巾", "不喜歡吃青菜、只吃肉", "常摸自己的眼、鼻、口"], a: 1 },
            { q: "颱風即將來臨，誰做好了防颱準備？", opts: ["小麗準備和家人去露營", "均均確認門窗是否緊閉", "純純和朋友到海邊觀浪", "小遠將盆栽擺放在陽臺外"], a: 1 },
            { q: "語婕在公車上遭遇不舒服的碰觸，她可以怎麼做？", opts: ["立即離開並請求幫助", "默默忍受直到下車", "不理會不舒服的感受", "蹲在車廂角落"], a: 0 },
            { q: "下列何者可能屬於騷擾的行為？", opts: ["醫師看診時，碰觸病患的腹部確認疼痛部位", "阿強和舞蹈社的同學牽手跳舞", "俊俊邊開玩笑邊拉扯同學的衣服", "小庭和隔壁班同學擊掌打招呼"], a: 2 },
            { q: "下列何者是男生和女生相同的第二性徵？", opts: ["長鬍鬚", "長腋毛", "喉結突出", "肩膀變寬"], a: 1 },
            { q: "颱風過後，小羽一家人和鄰居一起整理環境，並檢查居家環境的損壞情形。請問整理環境時下列何者的穿著較適當，能避免因接觸汙染物而造成感染？", opts: ["爸爸穿拖鞋、戴遮陽帽", "媽媽穿雨衣、戴棉紗手套", "小羽穿雨鞋、戴防水手套和口罩", "弟弟穿短褲、戴口罩"], a: 2 }
        ];

        // 遊戲狀態變數
        let currentQuestions = [];
        let currentIndex = 0;
        let currentScore = 0;
        let currentSeat = '';
        let startTime = 0;
        let timerInterval = null;
        let isAnswering = false;
        
        // 雲端連線變數
        let firebaseApp, auth, db, appId, currentUser;
        let cloudLeaderboard = [];

        // 初始化 Firebase
        try {
            const firebaseConfig = {
            apiKey: "AIzaSyD8jjaj6if9PwJ3ULZUBRZNUVxMJICQXro",
            authDomain: "classtest-game.firebaseapp.com",
            projectId: "classtest-game",
            storageBucket: "classtest-game.firebasestorage.app",
            messagingSenderId: "830390536169",
            appId: "1:830390536169:web:50f735890acfccf61f2d78"
        };
        appId = "health-class-4"; // 幫您的遊戲取個代號 (英文數字都可以)
            
            if (Object.keys(firebaseConfig).length > 0) {
                firebaseApp = initializeApp(firebaseConfig);
                auth = getAuth(firebaseApp);
                db = getFirestore(firebaseApp);

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) {
                        setupCloudListener();
                    }
                });
            }
        } catch (e) {
            console.error("Firebase 連線初始化失敗:", e);
            document.getElementById('btn-lb-text').innerText = "排行榜(單機模式)";
        }

        // 設置即時監聽雲端資料庫
        function setupCloudListener() {
            if (!currentUser) return;
            const lbCollection = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            onSnapshot(lbCollection, (snapshot) => {
                cloudLeaderboard = [];
                snapshot.forEach(doc => {
                    cloudLeaderboard.push(doc.data());
                });
                
                cloudLeaderboard.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.time - b.time;
                });
                
                renderLeaderboard();
            }, (error) => {
                console.error("讀取雲端排行榜發生錯誤:", error);
            });
        }

        // 上傳成績到雲端
        async function saveScoreToCloud(seat, score, time) {
            if (!currentUser) {
                const existing = cloudLeaderboard.find(e => e.seat === seat);
                if (existing) {
                    if (score > existing.score || (score === existing.score && time < existing.time)) {
                        existing.score = score;
                        existing.time = time;
                    }
                } else {
                    cloudLeaderboard.push({ seat, score, time });
                }
                cloudLeaderboard.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.time - b.time;
                });
                return;
            }
            try {
                const existing = cloudLeaderboard.find(e => e.seat === seat);
                if (existing) {
                    if (score < existing.score || (score === existing.score && time >= existing.time)) {
                        return; // 成績沒有進步，不更新
                    }
                }
                
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', seat);
                await setDoc(docRef, { seat, score, time });
            } catch (error) {
                console.error("上傳成績到雲端失敗:", error);
            }
        }

        // 工具：打亂陣列
        function shuffleArray(array) {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        // 工具：格式化時間
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}分 ${s}秒`;
        }

        // 切換畫面
        window.showScreen = function(screenId) {
            const screens = ['screen-login', 'screen-playing', 'screen-result', 'screen-leaderboard'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (id === screenId) {
                    el.classList.add('active');
                    el.classList.remove('fade-in');
                    void el.offsetWidth; 
                    el.classList.add('fade-in');
                } else {
                    el.classList.remove('active');
                }
            });

            if (screenId === 'screen-login') {
                document.getElementById('seat-input').value = '';
                document.getElementById('login-error').style.display = 'none';
            } else if (screenId === 'screen-leaderboard') {
                renderLeaderboard();
            }
        }

        // 開始遊戲
        window.startGame = function() {
            const seatInput = document.getElementById('seat-input').value.trim();
            const errorMsg = document.getElementById('login-error');
            
            if (!seatInput) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';
            currentSeat = seatInput;

            let tf = shuffleArray(tfQuestionsDB).slice(0, 25).map(q => ({...q, type: 'tf'}));
            let mc = shuffleArray(mcQuestionsDB).slice(0, 25).map(q => ({...q, type: 'mc'}));
            currentQuestions = shuffleArray([...tf, ...mc]);
            
            currentIndex = 0;
            currentScore = 0;
            isAnswering = false;
            
            window.showScreen('screen-playing');
            
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('timer-display').innerText = formatTime(elapsed);
            }, 1000);

            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('question-counter').innerText = `第 ${currentIndex + 1} / 50 題`;
            document.getElementById('question-type-tag').innerText = q.type === 'tf' ? '是非題' : '選擇題';
            document.getElementById('question-text').innerText = q.q;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            document.getElementById('question-box').style.borderColor = '#bfdbfe';
            document.getElementById('feedback-overlay').classList.remove('show');

            if (q.type === 'tf') {
                optsContainer.className = 'options-grid grid-2';
                
                const btnO = document.createElement('button');
                btnO.className = "btn-3d btn-tf-o";
                btnO.innerText = 'O';
                btnO.onclick = () => window.handleAnswer(0);
                
                const btnX = document.createElement('button');
                btnX.className = "btn-3d btn-tf-x";
                btnX.innerText = 'X';
                btnX.onclick = () => window.handleAnswer(1);

                optsContainer.appendChild(btnO);
                optsContainer.appendChild(btnX);
            } else {
                optsContainer.className = 'options-grid grid-2';
                
                q.opts.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "btn-3d btn-mc";
                    btn.onclick = () => window.handleAnswer(idx);
                    
                    const numSpan = document.createElement('span');
                    numSpan.className = "mc-num";
                    numSpan.innerText = idx + 1;
                    
                    const textSpan = document.createElement('span');
                    textSpan.innerText = opt;
                    
                    btn.appendChild(numSpan);
                    btn.appendChild(textSpan);
                    optsContainer.appendChild(btn);
                });
            }
            isAnswering = false;
        }

        // 處理作答邏輯
        window.handleAnswer = function(selectedIndex) {
            if (isAnswering) return;
            isAnswering = true;

            const q = currentQuestions[currentIndex];
            const isCorrect = selectedIndex === q.a;
            
            if (isCorrect) currentScore += 2;

            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');
            const qBox = document.getElementById('question-box');

            if (isCorrect) {
                overlay.className = "feedback-overlay show feedback-correct";
                icon.innerText = '✅';
                text.innerText = '答對了！';
                qBox.style.borderColor = '#4ade80';
            } else {
                overlay.className = "feedback-overlay show feedback-wrong";
                icon.innerText = '❌';
                text.innerText = '答錯了！';
                qBox.style.borderColor = '#f87171';
            }

            setTimeout(() => {
                if (currentIndex + 1 < currentQuestions.length) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    finishGame();
                }
            }, 800);
        }

        // 遊戲結束與寫入雲端
        async function finishGame() {
            clearInterval(timerInterval);
            const finalTime = Math.floor((Date.now() - startTime) / 1000);
            
            await saveScoreToCloud(currentSeat, currentScore, finalTime);

            document.getElementById('final-score').innerText = currentScore;
            document.getElementById('final-time').innerText = formatTime(finalTime);
            window.showScreen('screen-result');
        }

        // 渲染排行榜 (資料來源改為 cloudLeaderboard)
        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            
            if (cloudLeaderboard.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 30px; color: #94a3b8; font-weight:bold;">目前榜單空空如也，趕快搶下全班第一！</td></tr>`;
                return;
            }

            cloudLeaderboard.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                let rankHtml = `<span style="color:#94a3b8">${idx + 1}</span>`;
                if (idx === 0) rankHtml = '🥇';
                if (idx === 1) rankHtml = '🥈';
                if (idx === 2) rankHtml = '🥉';

                tr.innerHTML = `
                    <td style="text-align:center;">${rankHtml}</td>
                    <td style="text-align:center;">${entry.seat}</td>
                    <td style="text-align:center; color:#2563eb;">${entry.score}</td>
                    <td style="text-align:center; color:#64748b; font-size:18px;">${formatTime(entry.time)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 監聽 Enter 鍵
        document.getElementById('seat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                window.startGame();
            }
        });
    </script>
